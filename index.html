/* ---------- documento assinado: termo original + comprovante de aceite ---------- */
const pdfSafe = s => String(s == null ? '' : s).replace(/[^\x20-\x7E\u00A0-\u00FF\u2013\u2014\u2018\u2019\u201C\u201D\u2022]/g, '?');
async function buildSignedPdf(origBytes, term, acc){
  if(!window.PDFLib) throw new Error('A biblioteca pdf-lib não carregou. Verifique sua conexão com a internet.');
  const { PDFDocument, StandardFonts, rgb } = window.PDFLib;
  const pdf = await PDFDocument.load(origBytes);
  const page = pdf.addPage([595.28, 841.89]);
  const font = await pdf.embedFont(StandardFonts.Helvetica), bold = await pdf.embedFont(StandardFonts.HelveticaBold), mono = await pdf.embedFont(StandardFonts.Courier);
  const M = 50, W = 595.28; let y = 790;
  try{
    const png = await pdf.embedPng(LOGO.dataUrl); const lh = 28, lw = lh * LOGO.w / LOGO.h;
    page.drawImage(png, { x: W - M - lw, y: y - lh + 8, width: lw, height: lh });
  }catch(e){}
  page.drawText('COMPROVANTE DE ACEITE DIGITAL', { x:M, y, size:16, font:bold, color: rgb(0.1,0.12,0.18) }); y -= 18;
  page.drawText(pdfSafe(`${termKindLabel(term)} nº ${term.number}`), { x:M, y, size:10.5, font, color: rgb(0.35,0.37,0.45) }); y -= 34;
  const wrap = (text, f, size, maxW) => {
    const out = []; let line = '';
    pdfSafe(text).split(/\s+/).forEach(w => { const t = line ? line + ' ' + w : w; if(f.widthOfTextAtSize(t, size) <= maxW) line = t; else { if(line) out.push(line); line = w; } });
    if(line) out.push(line); return out.length ? out : [''];
  };
  const row = (label, value, f) => {
    const lines = wrap(value || '—', f || font, 10, W - M - (M + 175));
    page.drawText(pdfSafe(label), { x:M, y, size:9, font:bold, color: rgb(0.4,0.42,0.5) });
    lines.forEach((l, i) => page.drawText(l, { x: M + 175, y: y - i * 13, size:10, font: f || font, color: rgb(0.1,0.12,0.18) }));
    y -= Math.max(1, lines.length) * 13 + 8;
  };
  row('Documento', `${termKindLabel(term)} nº ${term.number}`);
  row('Equipamento', term.equipmentLabel);
  row('Responsável', term.responsibleName);
  if(acc.recipientEmail) row('E-mail da solicitação', acc.recipientEmail);
  row('Aceito por (nome digitado)', acc.acceptedName);
  row('Data e hora do aceite', `${fmtBR(acc.acceptedAt)} (horário de Brasília)`);
  row('Endereço IP', acc.acceptedIp || 'não disponível');
  row('Dispositivo / navegador', acc.acceptedUa || 'não disponível');
  row('Link gerado em', acc.sentAt ? `${fmtBR(acc.sentAt)} — ${acc.delivery === 'email' ? 'por e-mail, ao endereço cadastrado' : 'link individual, entregue pela área de TI'}` : '—');
  row('Código de verificação', acc.verificationCode, mono);
  row('SHA-256 do documento original', acc.docSha256, mono);
  y -= 8;
  const note = 'Este comprovante registra o aceite eletrônico do termo identificado acima, realizado pelo responsável por meio de link individual enviado pela área de TI. As páginas anteriores são o documento original, sem alterações: o hash SHA-256 acima identifica exatamente esse arquivo.';
  wrap(note, font, 9.5, W - 2 * M).forEach(l => { page.drawText(l, { x:M, y, size:9.5, font, color: rgb(0.3,0.32,0.4) }); y -= 13; });
  return pdf.save();
}

function SignedDocModal({ ctx, term, acc, onClose }){
  const [st, setSt] = useState({ phase:'loading' });
  useEffect(()=>{
    let url = null, dead = false;
    (async ()=>{
      try{
        const res = await fetch(term.fileUrl); if(!res.ok) throw new Error('Não foi possível ler o PDF original (HTTP ' + res.status + ').');
        const orig = await res.arrayBuffer();
        const hash = await sha256Hex(orig);
        let bytes;
        try{ bytes = await buildSignedPdf(orig, term, acc); }
        catch(e){ if(acc.docSha256 && hash !== acc.docSha256) throw new Error('O PDF guardado no Storage foi alterado depois do envio para aceite (o hash SHA-256 não confere) e não pôde ser aberto.'); throw e; }
        const blob = new Blob([bytes], { type:'application/pdf' }); url = URL.createObjectURL(blob);
        if(!dead) setSt({ phase:'ready', url, blob, integrity: !acc.docSha256 ? 'unknown' : (hash === acc.docSha256 ? 'ok' : 'mismatch') });
      }catch(e){ console.error(e); if(!dead) setSt({ phase:'error', message: e.message || String(e) }); }
    })();
    return ()=>{ dead = true; if(url) URL.revokeObjectURL(url); };
  }, [term.id, acc.id]);
  return (
    <Modal title={`Documento assinado — ${term.number}`} onClose={onClose} width={900} footer={
      st.phase === 'ready' ? <React.Fragment>
        <button className="btn btn-soft btn-sm" onClick={()=>window.open(st.url, '_blank')}>Abrir em nova aba</button>
        <button className="btn btn-primary btn-sm" onClick={()=>downloadBlob(st.blob, `${term.number}-aceito.pdf`)}><Icon path={ICONS.download} size={14}/> Baixar documento assinado</button>
      </React.Fragment> : null
    }>
      <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap', marginBottom:10, fontSize:12.5, color:'var(--text-muted)' }}>
        <StatusBadge tone="success">Aceito digitalmente</StatusBadge>
        <span>{acc.acceptedName} · {fmtBR(acc.acceptedAt)} · código <strong style={{ color:'var(--text)' }}>{acc.verificationCode}</strong></span>
        {st.phase === 'ready' && (st.integrity === 'ok' ? <StatusBadge tone="success">Integridade confirmada</StatusBadge> : st.integrity === 'mismatch' ? <StatusBadge tone="danger">PDF original alterado</StatusBadge> : <StatusBadge tone="muted">Sem hash para conferir</StatusBadge>)}
      </div>
      {st.phase === 'loading' && <EmptyState text="Montando o documento assinado..." />}
      {st.phase === 'error' && <div style={{ color:'#F0B3B3', fontSize:13 }}>{st.message}</div>}
      {st.phase === 'ready' && st.integrity === 'mismatch' && <div style={{ color:'#F0B3B3', fontSize:12.5, marginBottom:8 }}>Atenção: o PDF guardado no Storage não tem o mesmo hash registrado no momento do envio. Ele pode ter sido substituído depois.</div>}
      {st.phase === 'ready' && <iframe title={`Documento assinado ${term.number}`} src={st.url} style={{ width:'100%', height:'62vh', border:'1px solid var(--border)', borderRadius:8, background:'#fff' }} />}
    </Modal>
  );
}

/* ---------- página que o destinatário abre pelo link de aceite (sem login, sem menu) ---------- */
function AcceptancePage({ token, project }){
  const [phase, setPhase] = useState('loading'); const [data, setData] = useState(null); const [err, setErr] = useState('');
  const [agree, setAgree] = useState(false); const [name, setName] = useState(''); const [busy, setBusy] = useState(false); const [done, setDone] = useState(null);
  const base = /^https:\/\//.test(project) ? `${cleanSupabaseUrl(project)}/functions/v1/term-acceptance` : '';
  const post = async body => { const res = await fetch(base, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) }); let j = {}; try{ j = await res.json(); }catch(e){} return j; };
  useEffect(()=>{
    const vp = document.querySelector('meta[name=viewport]'); if(vp) vp.setAttribute('content', 'width=device-width, initial-scale=1');
    document.title = 'Aceite digital de termo';
    if(!base){ setErr('Link inválido.'); setPhase('error'); return; }
    post({ action:'get', token }).then(r => { if(r.ok){ setData(r); setPhase('ready'); } else { setErr(r.message || 'Link inválido.'); setPhase('error'); } })
      .catch(() => { setErr('Não foi possível carregar o termo. Verifique sua conexão e tente novamente.'); setPhase('error'); });
  }, []);
  const accept = async ()=>{
    setBusy(true); setErr('');
    try{
      const r = await post({ action:'accept', token, name, userAgent: navigator.userAgent });
      if(r.ok) setDone(r);
      else if(r.error === 'already_accepted'){ setData({ ...data, status:'aceito', acceptedAt:r.acceptedAt, verificationCode:r.verificationCode, acceptedName:name }); }
      else setErr(r.message || 'Não foi possível registrar o aceite.');
    }catch(e){ setErr('Falha de conexão. Tente novamente.'); }
    finally{ setBusy(false); }
  };
  const box = { maxWidth:780, margin:'0 auto', padding:'20px 16px 60px' };
  const t = data && data.term;
  return (
    <div style={{ minHeight:'100vh', background:'var(--bg)' }}>
      <div style={box}>
        <div style={{ display:'flex', alignItems:'center', gap:12, marginBottom:18 }}>
          <BrandSymbol size={48} />
          <div><div className="font-display" style={{ fontSize:19, fontWeight:600 }}>Aceite digital de termo</div><div style={{ fontSize:12, color:'var(--text-faint)' }}>{t && t.orgName ? t.orgName + ' · ' : ''}Área de TI</div></div>
        </div>
        {phase === 'loading' && <div className="card" style={{ padding:30, textAlign:'center', color:'var(--text-muted)' }}>Carregando o termo...</div>}
        {phase === 'error' && <div className="card" style={{ padding:24, borderColor:'#F1685E55' }}><div style={{ fontWeight:700, marginBottom:6 }}>Não foi possível abrir este termo</div><div style={{ color:'var(--text-muted)', fontSize:14, lineHeight:1.6 }}>{err}</div></div>}
        {phase === 'ready' && data && (
          <React.Fragment>
            <div className="card" style={{ padding:16, marginBottom:14, fontSize:14, lineHeight:1.7 }}>
              <div><strong>{t.kindLabel}</strong> nº <strong>{t.number}</strong></div>
              <div><span style={{ color:'var(--text-faint)' }}>Responsável:</span> {data.recipientName}</div>
              <div><span style={{ color:'var(--text-faint)' }}>Equipamento:</span> {t.equipmentLabel}</div>
            </div>
            {(done || data.status === 'aceito') ? (
              <div className="card" style={{ padding:22, borderColor:'#7CCBA266', background:'var(--success-soft)' }}>
                <div style={{ fontSize:18, fontWeight:700, color:'#A8DDBF', marginBottom:6 }}>Termo aceito{done ? ' com sucesso' : ''}</div>
                <div style={{ fontSize:14, lineHeight:1.7 }}>
                  {(done ? done.acceptedName : data.acceptedName) ? <div>Aceito por <strong>{done ? done.acceptedName : data.acceptedName}</strong></div> : null}
                  <div>Data e hora: <strong>{fmtBR(done ? done.acceptedAt : data.acceptedAt)}</strong> (horário de Brasília)</div>
                  <div>Código de verificação: <strong>{done ? done.verificationCode : data.verificationCode}</strong></div>
                </div>
                <div style={{ fontSize:12.5, color:'var(--text-muted)', marginTop:10 }}>A área de TI já recebeu o seu aceite. Você pode fechar esta página.</div>
              </div>
            ) : data.status === 'expirado' ? (
              <div className="card" style={{ padding:22, borderColor:'#F1685E55' }}><div style={{ fontWeight:700, marginBottom:6 }}>Este link expirou</div><div style={{ color:'var(--text-muted)', fontSize:14 }}>Peça à área de TI um novo envio do termo.</div></div>
            ) : data.status === 'cancelado' ? (
              <div className="card" style={{ padding:22, borderColor:'#F1685E55' }}><div style={{ fontWeight:700, marginBottom:6 }}>Esta solicitação foi cancelada</div><div style={{ color:'var(--text-muted)', fontSize:14 }}>Se precisar aceitar o termo, peça um novo envio à área de TI.</div></div>
            ) : (
              <React.Fragment>
                <div style={{ display:'flex', gap:10, alignItems:'center', flexWrap:'wrap', marginBottom:10 }}>
                  <a className="btn btn-soft" href={t.pdfUrl} target="_blank" rel="noreferrer">Abrir o termo em tela cheia (PDF)</a>
                  <span style={{ fontSize:12.5, color:'var(--text-muted)' }}>Leia o termo completo antes de aceitar. Se ele não aparecer abaixo, use o botão ao lado.</span>
                </div>
                <iframe title="Termo" src={t.pdfUrl} style={{ width:'100%', height:'62vh', minHeight:380, border:'1px solid var(--border)', borderRadius:10, background:'#fff', marginBottom:16 }} />
                <div className="card" style={{ padding:18 }}>
                  <label style={{ display:'flex', gap:10, alignItems:'flex-start', fontSize:14, lineHeight:1.5, marginBottom:14 }}>
                    <input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)} style={{ width:20, height:20, marginTop:2, flexShrink:0 }} />
                    <span>Li o termo acima e concordo com todas as suas condições.</span>
                  </label>
                  <Field label="Digite seu nome completo para confirmar"><input value={name} onChange={e=>setName(e.target.value)} placeholder={data.recipientName} style={{ fontSize:16 }} autoComplete="name" /></Field>
                  {err && <div style={{ color:'#F0B3B3', fontSize:13, marginBottom:10 }}>{err}</div>}
                  <button className="btn btn-primary" onClick={accept} disabled={busy || !agree || name.trim().length < 5} style={{ width:'100%', justifyContent:'center', fontSize:17, padding:'14px 20px', letterSpacing:'.04em' }}>{busy ? 'REGISTRANDO...' : 'ACEITAR'}</button>
                  <div style={{ fontSize:11.5, color:'var(--text-faint)', marginTop:10, lineHeight:1.5 }}>Ao clicar em ACEITAR, são registrados a data e a hora, o seu endereço IP e o dispositivo usado, como comprovante do aceite. Este link é pessoal: não o encaminhe a outras pessoas.</div>
                </div>
              </React.Fragment>
            )}
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function TermViewerModal({ ctx, term: initial, onClose }){
  const { db, actions } = ctx;

  const [view, setView] = useState('generated');
  const [confirmDel, setConfirmDel] = useState(null);

  const acc = latestAcceptance(db, term.id);
  if(term.signedFilePath && !items.some(a => a.filePath === term.signedFilePath)){
    items.unshift({ id:'legacy_' + term.id, termId:term.id, filePath:term.signedFilePath, fileUrl:term.signedFileUrl, fileName:term.signedFileName || 'assinado', size:0, createdAt:term.signedAt || term.createdAt, legacy:true });

        <button className="btn btn-soft btn-sm" onClick={()=>window.open(src, '_blank')}>Abrir em nova aba</button>

      {sections.map(sec => (
        <div key={sec.h} style={{ marginBottom:8 }}>
          <div style={{ fontWeight:700, marginBottom:3 }}>{sec.h}</div>
          {(sec.items || []).map(it => (
            <div key={it.n} style={{ marginBottom:4 }}><strong>{it.n} {it.t}:</strong> {it.x}{(it.more || []).map((m,i) => <div key={i} style={{ marginTop:3 }}>{m}</div>)}</div>
          ))}
          {(sec.paras || []).map((m,i) => <div key={i} style={{ marginBottom:3 }}>{m}</div>)}
        </div>
      ))}
    </div>
  );
}

function TermsScreen({ ctx, params }){
  const { db, maps, actions, notify, setModal, askConfirm } = ctx;
  const initEq = params.equipmentId && maps.eq[params.equipmentId] ? maps.eq[params.equipmentId] : null;
  const [kind, setKind] = useState(params.kind === 'devolucao' ? 'devolucao' : 'entrega');
  const [showPreview, setShowPreview] = useState(false);   // no celular a pré-visualização começa recolhida
  const [equipId, setEquipId] = useState(initEq ? initEq.id : '');
  const [respId, setRespId] = useState(initEq ? (initEq.responsibleId || '') : '');
  const [assign, setAssign] = useState(true);
  const [condition, setCondition] = useState(RETURN_CONDITIONS[0]);
  const [details, setDetails] = useState('');
  const [observation, setObservation] = useState('');
  const [sendAccept, setSendAccept] = useState(true);
  const [register, setRegister] = useState(true);
  const [returnLoc, setReturnLoc] = useState('');
  const [busy, setBusy] = useState(false);
  const [q, setQ] = useState(''); const [fKind, setFKind] = useState(''); const [fSigned, setFSigned] = useState('');
  const fileRef = useRef(null); const attachFor = useRef(null);
  const isReturn = kind === 'devolucao';
  const eq = equipId ? maps.eq[equipId] : null;
  const resp = respId ? maps.resp[respId] : null;
  const info = eq ? eqInfo(eq, maps) : null;
  const { orgName, city } = db.settings;
  const eqs = db.equipments.filter(e => e.status !== 'Baixado' && (!isReturn || e.responsibleId)).sort((a,b)=> a.patrimony.localeCompare(b.patrimony, 'pt-BR', { numeric:true }));
  const damaged = condition === 'Com avarias' || condition === 'Inoperante';

  const switchKind = k => { setKind(k); setEquipId(''); setRespId(''); };
  const pickEquipment = id => { setEquipId(id); const e = maps.eq[id]; setRespId(e ? (e.responsibleId || '') : ''); setReturnLoc(''); };
  const refTerm = (isReturn && eq && resp) ? db.terms.filter(t => t.kind !== 'devolucao' && t.equipmentId === eq.id && t.responsibleId === resp.id).sort((a,b)=> b.createdAt - a.createdAt)[0] : null;
  const previewNumber = nextTermNumber(db, kind);

  const generate = async ()=>{
    if(!eq){ notify('Selecione o equipamento.', 'error'); return; }
    if(!resp){ notify('Selecione o responsável.', 'error'); return; }
    if(!window.jspdf){ notify('A biblioteca de PDF não carregou. Verifique sua conexão com a internet.', 'error'); return; }
    const client = ctx.sync.getClient();
    if(!client){ notify('Sem conexão com o banco. Conecte para salvar o termo.', 'error'); return; }
    setBusy(true);
    try{
      const number = nextTermNumber(db, kind);
      const willSend = sendAccept;
      const doc = buildTermPdf({
        digital: willSend, kind, number, org: orgName, city, patrimony: eq.patrimony, serial: eq.serial,
        category: info.category ? info.category.name : '', product: prodLabel(info.product), status: eq.status,
        locationName: info.location ? info.location.name : '', responsible: resp,
        condition, details: details.trim(), observation: observation.trim(), refNumber: refTerm ? refTerm.number : ''
      });
      const blob = doc.output('blob');
      const path = `${new Date().getFullYear()}/${number}.pdf`;
      const up = await client.storage.from('termos').upload(path, blob, { contentType:'application/pdf', upsert:true });
      if(up.error){
        downloadBlob(blob, `${number}.pdf`);
        notify('O PDF foi baixado, mas NÃO foi salvo no Storage (' + up.error.message + '). Rode o supabase/schema.sql para criar o bucket "termos" e tente de novo.', 'error');
        return;
      }
      const fileUrl = client.storage.from('termos').getPublicUrl(path).data.publicUrl;
      const term = { id: uid('trm'), number, kind, equipmentId: eq.id, responsibleId: resp.id,
        equipmentLabel: `${eq.patrimony} — ${prodLabel(info.product)}`, patrimony: eq.patrimony, serial: eq.serial || '',
        responsibleName: resp.name, locationName: info.location ? info.location.name : '', orgName: orgName || '',
        filePath: path, fileUrl, notes: isReturn ? `Condição: ${condition}${details.trim() ? ' | ' + details.trim() : ''}` : observation.trim(),
        signedFilePath:'', signedFileUrl:'', signedFileName:'', signedAt:null, createdAt: Date.now() };
      if(isReturn){
        if(register){
          actions.saveEquipment({ ...eq, responsibleId: null, status: damaged ? 'Em manutenção' : 'Em estoque', locationId: returnLoc || eq.locationId || null },
            `Devolução pelo termo ${number} (${condition})${details.trim() ? ': ' + details.trim() : ''}`, 'Devolução');
        }
      } else if(assign && eq.responsibleId !== resp.id){
        actions.saveEquipment({ ...eq, responsibleId: resp.id, status: eq.status === 'Em estoque' ? 'Em uso' : eq.status }, `Atribuição pelo termo ${number}`);
      }
      actions.addTerm(term);
      setObservation('');
      notify(`${isReturn ? 'Termo de devolução' : 'Termo'} ${number} gerado e salvo.`, 'success');
      let linkRes = null;
      if(willSend){
        await sbUpsertRow(client, 'terms', term);          // o aceite referencia o termo: ele precisa já estar no banco
        const r = await requestAcceptance(ctx, term, { days: 7, mode:'manual', blob });
        if(r.ok) linkRes = r;
        else notify('O termo foi gerado, mas o link de aceite NÃO foi criado: ' + r.message + ' Use o botão de link na linha do termo para tentar de novo.', 'error');
      }
      setModal(linkRes ? { type:'sendAcceptance', term, res: linkRes } : { type:'termViewer', term });
    }catch(e){ console.error(e); notify('Falha ao gerar o termo: ' + (e.message || e), 'error'); }
    finally{ setBusy(false); }
  };

  const onPickSigned = async e => {
    const f = e.target.files && e.target.files[0]; e.target.value = '';
    const t = attachFor.current; attachFor.current = null;
    if(f && t) stageAttachment(ctx, t, f);
  };
  const askAttach = t => { attachFor.current = t; fileRef.current && fileRef.current.click(); };

  const nq = norm(q.trim());
  const signedOf = t => !!t.signedFileUrl || isAccepted(db, t.id);
  const awaitingOf = t => { const a = latestAcceptance(db, t.id); return !!a && a.status === 'pendente' && effStatus(a) === 'pendente' && !!a.sentAt; };
  const history = db.terms.filter(t =>
    (!nq || norm([t.number, t.equipmentLabel, t.responsibleName, t.serial].join(' ')).includes(nq)) &&
    (!fKind || (t.kind || 'entrega') === fKind) &&
    (!fSigned || (fSigned === 'signed' ? signedOf(t) : fSigned === 'awaiting' ? awaitingOf(t) : !signedOf(t))));
  const pendingCount = db.terms.filter(t => !signedOf(t)).length;
  const awaitingCount = db.terms.filter(awaitingOf).length;
  const modeBtn = (k, label) => (
    <button className="btn btn-sm" onClick={()=>switchKind(k)} style={{ background: kind === k ? 'var(--accent)' : 'var(--surface-2)', color: kind === k ? '#101116' : 'var(--text-muted)', border:'1px solid var(--border)' }}>{label}</button>
  );

  return (
    <div className="fade-up">
      <h1 style={{ fontSize:24, margin:'0 0 4px', fontWeight:600 }}>Termos</h1>
      <p style={{ margin:'0 0 14px', color:'var(--text-muted)', fontSize:13 }}>Gere o termo, imprima para assinatura e anexe aqui o arquivo assinado (PDF ou foto).</p>
      <div className="mode-switch" style={{ display:'flex', gap:8, marginBottom:16, flexWrap:'wrap' }}>{modeBtn('entrega', 'Termo de responsabilidade (entrega)')}{modeBtn('devolucao', 'Termo de devolução')}</div>

      {ctx.can('terms','edit') && (
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1.2fr', gap:16, marginBottom:20 }}>
        <div className="card" style={{ padding:18 }}>
          <h3 style={{ margin:'0 0 14px', fontSize:15, fontWeight:600 }}>{isReturn ? 'Novo termo de devolução' : 'Novo termo de responsabilidade'}</h3>
          <Field label={isReturn ? 'Equipamento devolvido (com responsável)' : 'Equipamento'} hint={isReturn && !eqs.length ? 'Nenhum equipamento está atribuído a um responsável.' : undefined}><select value={equipId} onChange={e=>pickEquipment(e.target.value)}>
            <option value="">Selecione...</option>{eqs.map(e => <option key={e.id} value={e.id}>{eqLabel(e, maps)}{isReturn && maps.resp[e.responsibleId] ? ` (${maps.resp[e.responsibleId].name})` : ''}</option>)}
          </select></Field>
          <Field label={isReturn ? 'Responsável que está devolvendo' : 'Responsável'}><select value={respId} onChange={e=>setRespId(e.target.value)}>
            <option value="">Selecione...</option>{[...db.responsibles].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(r => <option key={r.id} value={r.id}>{r.name}</option>)}
          </select></Field>
          {isReturn ? (
            <React.Fragment>
              <Field label="Condição do equipamento"><select value={condition} onChange={e=>setCondition(e.target.value)}>{RETURN_CONDITIONS.map(c => <option key={c} value={c}>{c}</option>)}</select></Field>
              <Field label="Observações / acessórios devolvidos"><textarea rows={2} value={details} onChange={e=>setDetails(e.target.value)} placeholder="Ex.: carregador, mochila, tela riscada" /></Field>
              <label style={{ display:'flex', gap:8, alignItems:'center', fontSize:12.5, color:'var(--text-muted)', marginBottom:10 }}>
                <input type="checkbox" checked={register} onChange={e=>setRegister(e.target.checked)} />
                Dar baixa no sistema: remove o responsável e muda o status para {damaged ? '"Em manutenção"' : '"Em estoque"'}
              </label>
              {register && <Field label="Local de devolução"><select value={returnLoc} onChange={e=>setReturnLoc(e.target.value)}><option value="">Manter o local atual</option>{sortedLocs(db).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select></Field>}
            </React.Fragment>
          ) : (eq && resp && eq.responsibleId !== resp.id && (
            <label style={{ display:'flex', gap:8, alignItems:'center', fontSize:12.5, color:'var(--text-muted)', marginBottom:14 }}>
              <input type="checkbox" checked={assign} onChange={e=>setAssign(e.target.checked)} />
              Atribuir o equipamento a este responsável (registra movimentação)
            </label>
          ))}
          {!isReturn && <Field label="Observações (opcional)" hint="Sai no termo, na tabela de identificação do equipamento."><textarea rows={2} value={observation} onChange={e=>setObservation(e.target.value)} placeholder="Ex.: acompanha carregador, mouse e mochila" /></Field>}
          {!orgName && <div style={{ fontSize:12, color:'var(--warn)', marginBottom:12 }}>Dica: informe o nome da organização em Cadastros → Organização para ele sair no termo.</div>}
          {resp && (
            <label style={{ display:'flex', gap:8, alignItems:'flex-start', fontSize:12.5, color:'var(--text-muted)', marginBottom:12, lineHeight:1.5 }}>
              <input type="checkbox" checked={sendAccept} onChange={e=>setSendAccept(e.target.checked)} style={{ marginTop:3 }} />
              <span>Gerar <strong>link de aceite digital</strong> para o responsável. O PDF sai sem linhas de assinatura e o link aparece na tela ao gerar.</span>
            </label>
          )}
          <button className="btn btn-primary" onClick={generate} disabled={busy || !eq || !resp}><Icon path={ICONS.file} size={14}/> {busy ? 'Gerando...' : 'Gerar PDF e salvar'}</button>
        </div>
        <div className={`card term-preview ${showPreview ? 'open' : ''}`} style={{ padding:18, background:'#F7F8FB', color:'#1b1f2d' }}>
          <div className="tp-head" onClick={()=>setShowPreview(v => !v)} style={{ fontSize:11, fontWeight:700, color:'#7A8094', marginBottom:8, display:'flex', alignItems:'center', gap:8 }}>
            PRÉ-VISUALIZAÇÃO<span className="only-mobile" style={{ marginLeft:'auto', fontSize:12, color:'#5A6175', alignItems:'center', gap:4 }}>{showPreview ? 'Ocultar' : 'Toque para ver'}<Icon path={ICONS.chevronDown} size={14} style={{ transform: showPreview ? 'rotate(180deg)' : 'none' }}/></span>
          </div>
          <div style={{ textAlign:'center', fontWeight:700, fontSize:13.5, marginBottom:2 }}>{isReturn ? 'TERMO DE DEVOLUÇÃO DE EQUIPAMENTO DE TI' : 'TERMO DE RESPONSABILIDADE DE EQUIPAMENTO DE TI'}</div>
          <div style={{ textAlign:'center', fontSize:11.5, color:'#666', marginBottom:10 }}>Nº {previewNumber}{orgName ? ' — ' + orgName : ''}</div>
          <p style={{ fontSize:12, lineHeight:1.55, margin:'0 0 8px' }}>Eu, <strong>{resp ? resp.name : '________________'}</strong>{resp && resp.registration ? `, matrícula ${resp.registration}` : ''}{resp && resp.department ? `, setor ${resp.department}` : ''}, declaro ter {isReturn ? `devolvido${orgName ? ' à ' + orgName : ''}` : `recebido${orgName ? ' da ' + orgName : ''}`} o equipamento descrito abaixo{isReturn ? (refTerm ? `, que me foi entregue por meio do termo ${refTerm.number}, nas condições a seguir:` : ', nas condições a seguir:') : ', em perfeitas condições de uso e funcionamento, comprometendo-me a observar as condições a seguir:'}</p>
          <div style={{ fontSize:12, border:'1px solid #D5D9E4', borderRadius:6, padding:'6px 10px', marginBottom:8, lineHeight:1.7 }}>
            <div><strong>Patrimônio:</strong> {eq ? eq.patrimony : '—'}</div>
            <div><strong>Produto:</strong> {info ? `${info.category ? info.category.name + ' · ' : ''}${prodLabel(info.product)}` : '—'}</div>
            <div><strong>Nº de série:</strong> {eq && eq.serial ? eq.serial : '—'}</div>
            {isReturn ? <React.Fragment><div><strong>Condição:</strong> {condition}</div><div><strong>Observações:</strong> {details.trim() || '—'}</div></React.Fragment> : <React.Fragment><div><strong>Local:</strong> {info && info.location ? info.location.name : '—'}</div>{observation.trim() && <div><strong>Observações:</strong> {observation.trim()}</div>}</React.Fragment>}
          </div>
          <TermSectionsPreview sections={isReturn ? RETURN_SECTIONS : TERM_SECTIONS} />
        </div>
      </div>
      )}

      <div className="card" style={{ padding:18 }}>
        <input ref={fileRef} type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,application/pdf,image/*" style={{ display:'none' }} onChange={onPickSigned} />
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12, gap:10, flexWrap:'wrap' }}>
          <h3 style={{ margin:0, fontSize:15, fontWeight:600 }}>Histórico de termos ({db.terms.length}){awaitingCount > 0 && <span style={{ marginLeft:10 }}><StatusBadge tone="warn">{awaitingCount} aguardando aceite digital</StatusBadge></span>}{pendingCount > 0 && <span style={{ marginLeft:8 }}><StatusBadge tone="muted">{pendingCount} sem assinatura</StatusBadge></span>}</h3>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap', flex:'1 1 320px', justifyContent:'flex-end' }}>
            <input type="search" placeholder="Buscar termo, equipamento ou responsável..." value={q} onChange={e=>setQ(e.target.value)} style={{ flex:'1 1 260px', maxWidth:340, width:'auto', minWidth:0 }} />
            <MobileFilters count={[fKind, fSigned].filter(Boolean).length}>
            <select value={fKind} onChange={e=>setFKind(e.target.value)} style={{ width:150 }}><option value="">Todos os tipos</option><option value="entrega">Entrega</option><option value="devolucao">Devolução</option></select>
            <select value={fSigned} onChange={e=>setFSigned(e.target.value)} style={{ width:170 }}><option value="">Todas as situações</option><option value="signed">Assinados (aceite ou anexo)</option><option value="awaiting">Aguardando aceite digital</option><option value="pending">Sem assinatura</option></select>
            </MobileFilters>
          </div>
        </div>
        <div style={{ overflowX:'auto' }}>
          <table>
            <thead><tr><th>Nº</th><th>Tipo</th><th>Data</th><th>Equipamento</th><th>Responsável</th><th>Assinatura</th><th></th></tr></thead>
            <tbody>
              {history.map(t => (
                <tr key={t.id}>
                  <td style={{ fontWeight:700 }}>{t.number}</td>
                  <td><StatusBadge tone={t.kind === 'devolucao' ? 'teal' : 'indigo'}>{termKindLabel(t)}</StatusBadge></td>
                  <td style={{ color:'var(--text-muted)', whiteSpace:'nowrap' }}>{fmtDateTime(t.createdAt)}</td>
                  <td>{t.equipmentLabel}</td><td>{t.responsibleName}</td>
                  <td>{(() => { const a = latestAcceptance(db, t.id);
                    if(a && a.status === 'aceito') return <div><AcceptanceBadge acc={a} /><div style={{ fontSize:11, color:'var(--text-faint)', marginTop:2 }}>{fmtDateTime(a.acceptedAt)}</div></div>;
                    if(t.signedFileUrl) { const n = db.attachments.filter(x => x.termId === t.id).length; return <StatusBadge tone="success">Anexado{n > 1 ? ` (${n})` : ''}</StatusBadge>; }
                    if(a) return <div><AcceptanceBadge acc={a} />{a.sentAt && <div style={{ fontSize:11, color:'var(--text-faint)', marginTop:2 }}>link gerado {fmtDateTime(a.sentAt)}</div>}</div>;
                    return <StatusBadge tone="warn">Pendente</StatusBadge>; })()}</td>
                  <td><div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>
                    {isAccepted(db, t.id) && <button className="btn btn-ghost btn-sm" title="Ver documento assinado (aceite digital)" data-m="Assinado" onClick={()=>setModal({ type:'signedDoc', term:t, acc: latestAcceptance(db, t.id) })}><Icon path={ICONS.shield} size={13}/></button>}
                    {!isAccepted(db, t.id) && ctx.can('terms','edit') && <button className="btn btn-ghost btn-sm" title="Gerar link de aceite digital" data-m="Link de aceite" onClick={()=>setModal({ type:'sendAcceptance', term:t })}><Icon path={ICONS.mail} size={13}/></button>}
                    {ctx.can('terms','edit') && <button className="btn btn-ghost btn-sm" title="Anexar arquivo assinado" data-m="Anexar" onClick={()=>askAttach(t)}><Icon path={ICONS.paperclip} size={13}/></button>}
                    <button className="btn btn-ghost btn-sm" title="Visualizar" onClick={()=>setModal({ type:'termViewer', term:t })}><Icon path={ICONS.eye} size={13}/></button>
                    <button className="btn btn-ghost btn-sm" title="Baixar PDF" onClick={()=>downloadTerm(ctx, t)}><Icon path={ICONS.download} size={13}/></button>
                    {ctx.can('terms','edit') && <button className="btn btn-ghost btn-sm" title="Excluir" onClick={()=>askConfirm({ title:'Excluir termo', tone:'danger', confirmLabel:'Excluir', message:`Excluir o termo ${t.number}? O PDF${t.signedFileUrl ? ' e o arquivo assinado' : ''} também serão removidos${isAccepted(db, t.id) ? ', e o COMPROVANTE DE ACEITE DIGITAL será apagado junto' : ''}.`, onConfirm:()=>actions.deleteItem('terms', t.id) })}><Icon path={ICONS.trash} size={13}/></button>}
                  </div></td>
                </tr>
              ))}
              {history.length === 0 && <tr><td colSpan={7}><EmptyState text="Nenhum termo encontrado." /></td></tr>}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   CADASTROS (categorias, produtos, locais, responsáveis, organização)
   ============================================================ */
const CRUD = {
  categories: { label:'Categorias', single:'categoria',
    fields:[{ k:'name', label:'Nome', req:true }],
    cols:[['Nome', (r)=>r.name]], usedLabel:'Produtos' },
  products: { label:'Produtos', single:'produto',
    fields:[{ k:'categoryId', label:'Categoria', req:true, type:'select', opts:'categories' }, { k:'name', label:'Nome / modelo', req:true, ph:'Ex.: Latitude 5420' }, { k:'brand', label:'Marca', ph:'Ex.: Dell' }, { k:'model', label:'Modelo / versão' }, { k:'subtype', label:'Tipo', ph:'Ex.: A4, Térmica (impressoras)' }, { k:'assetValue', label:'Valor de patrimônio (R$, por unidade)', type:'money', ph:'Ex.: 3.500,00' }],
    cols:[['Categoria', (r,db)=>{ const c = db.categories.find(x=>x.id===r.categoryId); return c ? c.name : '—'; }], ['Produto', (r)=>prodLabel(r)], ['Tipo', (r)=>r.subtype || '—'], ['Valor (R$)', (r)=>fmtBRL(r.assetValue)]], usedLabel:'Equipamentos' },
  locations: { label:'Locais', single:'local',
    fields:[{ k:'name', label:'Nome', req:true, ph:'Ex.: G1' }, { k:'description', label:'Descrição', ph:'Opcional' }],
    cols:[['Nome', (r)=>r.name], ['Descrição', (r)=>r.description || '—']], usedLabel:'Equipamentos' },
  sectors: { label:'Setores', single:'setor',
    fields:[{ k:'locationId', label:'Local (galpão)', req:true, type:'select', opts:'locations' }, { k:'name', label:'Nome do setor', req:true, ph:'Ex.: Financeiro' }, { k:'description', label:'Descrição', ph:'Opcional' }],
    cols:[['Local', (r,db)=>{ const l = db.locations.find(x => x.id === r.locationId); return l ? l.name : '— definir local'; }], ['Nome', (r)=>r.name], ['Descrição', (r)=>r.description || '—']], usedLabel:'Equipamentos' },
  responsibles: { label:'Responsáveis', single:'responsável',
    fields:[{ k:'name', label:'Nome completo', req:true }, { k:'registration', label:'Matrícula' }, { k:'department', label:'Setor' }, { k:'email', label:'E-mail' }, { k:'phone', label:'Telefone' }],
    cols:[['Nome', (r)=>r.name], ['Matrícula', (r)=>r.registration || '—'], ['Setor', (r)=>r.department || '—'], ['E-mail', (r)=>r.email || '—']], usedLabel:'Equipamentos' },
};

function CrudFormModal({ ctx, kind, item, onClose }){
  const { db, actions } = ctx; const cfg = CRUD[kind];
  const [f, setF] = useState(()=>{ const base = item ? { ...item } : {}; cfg.fields.forEach(fl => { if(base[fl.k] === undefined || base[fl.k] === null) base[fl.k] = ''; if(fl.type === 'money' && base[fl.k] !== '') base[fl.k] = fmtNumBR(base[fl.k]); }); return base; });
  const submit = ()=>{ const out = { ...f, id: item ? item.id : undefined }; cfg.fields.forEach(fl => { if(fl.type === 'money') out[fl.k] = parseMoney(out[fl.k]); }); if(actions.saveItem(kind, out)) onClose(); };
  return (
    <Modal title={`${item ? 'Editar' : 'Nova'} ${cfg.single}`} onClose={onClose} width={480} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={submit}>{item ? 'Salvar' : 'Cadastrar'}</button></React.Fragment>
    }>
      {cfg.fields.map((fl, idx) => (
        <Field key={fl.k} label={fl.label + (fl.req ? ' *' : '')}>
          {fl.type === 'select'
            ? <select value={f[fl.k]} onChange={e=>setF({ ...f, [fl.k]: e.target.value })}><option value="">Selecione...</option>{db[fl.opts].map(o => <option key={o.id} value={o.id}>{o.name}</option>)}</select>
            : <input value={f[fl.k]} onChange={e=>setF({ ...f, [fl.k]: e.target.value })} placeholder={fl.ph || ''} autoFocus={idx === 0} inputMode={fl.type === 'money' ? 'decimal' : undefined} />}
        </Field>
      ))}
    </Modal>
  );
}

function CrudTab({ ctx, kind }){
  const { db, actions, askConfirm } = ctx; const cfg = CRUD[kind];
  const [q, setQ] = useState(''); const [editing, setEditing] = useState(undefined);

  const dcmp = kind === 'sectors' ? (a,b)=> secLocName(db,a).localeCompare(secLocName(db,b), 'pt-BR', { numeric:true }) || byName(a,b) : byName;   // setores: por local e depois por nome
  const uniq = fn => [...new Set(db[kind].map(fn).filter(Boolean))].sort((a,b)=> String(a).localeCompare(String(b), 'pt-BR'));
  const hasFilter = !!(q.trim() || fa || fb || fUse);
  const clearFilters = ()=>{ setQ(''); setFa(''); setFb(''); setFUse(''); };
  const filtered = db[kind].filter(r => {
    if(kind === 'products'){ if(fa && r.categoryId !== fa) return false; if(fb && (r.brand || '') !== fb) return false; }
    if(kind === 'responsibles' && fa && (r.department || '') !== fa) return false;
    if(kind === 'sectors' && fa && r.locationId !== fa) return false;
    if(fUse){ const n = actions.useCount(kind, r.id); if(fUse === 'used' ? n === 0 : n > 0) return false; }
    const nq = norm(q.trim());
    if(nq){
      // procura no que aparece na tabela (inclui o NOME da categoria) e nos campos de texto; cada palavra digitada precisa ser achada, em qualquer ordem
      const hay = norm(cfg.cols.map(c => c[1](r, db)).concat(cfg.fields.filter(fl => fl.type !== 'select').map(fl => r[fl.k])).join(' '));
      if(!nq.split(/\s+/).every(w => hay.includes(w))) return false;
    }
    return true;
  });
  const sortVal = (r, k)=> k === 'use' ? actions.useCount(kind, r.id) : String(cfg.cols[k][1](r, db));
  const rows = [...filtered].sort((a,b)=>{
    if(!sort) return dcmp(a,b);
    const va = sortVal(a, sort.k), vb = sortVal(b, sort.k);
    const c = (typeof va === 'number' ? va - vb : va.localeCompare(vb, 'pt-BR', { numeric:true })) * sort.dir;
    return c || dcmp(a,b);
  });
  const toggleSort = k => setSort(sv => (!sv || sv.k !== k) ? { k, dir:1 } : sv.dir === 1 ? { k, dir:-1 } : null);
  const sortTh = (k, label) => <th key={String(k)} onClick={()=>toggleSort(k)} style={{ cursor:'pointer', userSelect:'none' }} title="Clique para ordenar">{label}{sort && sort.k === k ? (sort.dir === 1 ? ' ▲' : ' ▼') : ''}</th>;
  const selStyle = { flex:'0 1 190px', width:'auto', minWidth:0 };
  return (
    <div>
      <div style={{ display:'flex', gap:10, marginBottom:14, flexWrap:'wrap', alignItems:'center' }}>
        <div style={{ position:'relative', flex:'1 1 240px', maxWidth:340 }}>

          <input type="search" placeholder={`Buscar ${cfg.label.toLowerCase()}...`} value={q} onChange={e=>setQ(e.target.value)} style={{ paddingLeft:30 }} />
        </div>
        <MobileFilters count={[fa, fb, fUse].filter(Boolean).length}>
        {kind === 'products' && <React.Fragment>
          <select value={fa} onChange={e=>setFa(e.target.value)} style={selStyle}><option value="">Todas as categorias</option>{[...db.categories].sort(byName).map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
          <select value={fb} onChange={e=>setFb(e.target.value)} style={selStyle}><option value="">Todas as marcas</option>{uniq(p => p.brand).map(b => <option key={b} value={b}>{b}</option>)}</select>
        </React.Fragment>}
        {kind === 'responsibles' && <select value={fa} onChange={e=>setFa(e.target.value)} style={selStyle}><option value="">Todos os setores</option>{uniq(r => r.department).map(d => <option key={d} value={d}>{d}</option>)}</select>}
        {kind === 'sectors' && <select value={fa} onChange={e=>setFa(e.target.value)} style={selStyle}><option value="">Todos os locais</option>{sortedLocs(db).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select>}
        <select value={fUse} onChange={e=>setFUse(e.target.value)} style={selStyle}><option value="">Todos</option><option value="used">Com {cfg.usedLabel.toLowerCase()}</option><option value="unused">Sem {cfg.usedLabel.toLowerCase()}</option></select>
        {hasFilter && <button className="btn btn-ghost btn-sm" onClick={clearFilters}><Icon path={ICONS.x} size={13}/> Limpar</button>}
        </MobileFilters>
        <span style={{ color:'var(--text-muted)', fontSize:12.5 }}>{rows.length} de {db[kind].length}</span>
        <div style={{ flex:1 }} />
        {ctx.can('registry','edit') && <button className="btn btn-primary btn-sm" onClick={()=>setEditing(null)}><Icon path={ICONS.plus} size={14}/> Nova {cfg.single}</button>}
      </div>
      <div className="card" style={{ overflowX:'auto' }}>
        <table>
          <thead><tr>{cfg.cols.map((c,i) => sortTh(i, c[0]))}{sortTh('use', cfg.usedLabel)}<th></th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.id}>
                {cfg.cols.map((c,i) => <td key={c[0]} style={{ fontWeight: i === 0 ? 600 : 400 }}>{c[1](r, db)}</td>)}
                <td style={{ color:'var(--text-muted)' }}>{actions.useCount(kind, r.id)}</td>
                <td><div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>
                  {ctx.can('registry','edit') && <button className="btn btn-ghost btn-sm" title="Editar" onClick={()=>setEditing(r)}><Icon path={ICONS.edit} size={13}/></button>}
                  {ctx.can('registry','edit') && <button className="btn btn-ghost btn-sm" title="Excluir" onClick={()=>askConfirm({ title:`Excluir ${cfg.single}`, tone:'danger', confirmLabel:'Excluir', message:`Excluir "${r.name}"?`, onConfirm:()=>actions.deleteItem(kind, r.id) })}><Icon path={ICONS.trash} size={13}/></button>}
                </div></td>
              </tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={cfg.cols.length + 2}><EmptyState text={db[kind].length ? 'Nenhum resultado com esses filtros.' : `Nenhum(a) ${cfg.single} cadastrado(a).`} /></td></tr>}
          </tbody>
        </table>
      </div>
      {editing !== undefined && <CrudFormModal ctx={ctx} kind={kind} item={editing} onClose={()=>setEditing(undefined)} />}
    </div>
  );
}

/* ============================================================
   INFORMAÇÕES ADMINISTRATIVAS DE TI
   Galpões (dados cadastrais, endereço, observações), conexões de
   internet, redes Wi-Fi e dispositivos de rede. Senhas de Wi-Fi ficam
   CRIPTOGRAFADAS (AES-256-GCM) no banco; a senha mestra nunca é salva.
   ============================================================ */
const VAULT_IDLE_MS = 10 * 60 * 1000;   // o cofre bloqueia sozinho após 10 min sem uso
const VAULT_CHECK = 'thaenviado-vault-v1';
const b64 = buf => { let s = ''; new Uint8Array(buf).forEach(c => { s += String.fromCharCode(c); }); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, saltB64){
  if(!(window.crypto && crypto.subtle)) throw new Error('Este navegador/endereço não oferece criptografia. Use o sistema por HTTPS (ou abra o arquivo localmente).');
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt: unb64(saltB64), iterations: 250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptText(key, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
  return `v1:${b64(iv)}:${b64(ct)}`;
}
async function decryptText(key, packed){
  const [ver, iv, ct] = String(packed).split(':');
  if(ver !== 'v1') throw new Error('formato desconhecido');
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: unb64(iv) }, key, unb64(ct));
  return new TextDecoder().decode(pt);
}

const SITE_TYPES = [['matriz','Matriz'], ['filial','Filial']];
const SITE_STATUS = [['ativo','Ativo'], ['inativo','Inativo']];
const LINK_TYPES = [['fibra','Fibra óptica'], ['radio','Rádio'], ['outro','Outro']];
const IP_MODES = [['dinamico','Dinâmico'], ['fixo','Fixo']];
const LINK_STATUS = [['ativa','Ativa'], ['inativa','Inativa'], ['manutencao','Em manutenção']];
const WIFI_USAGE = [['corporativa','Corporativa'], ['visitantes','Visitantes'], ['dispositivos','Dispositivos'], ['personalizada','Personalizada']];
const WIFI_FREQ = [['2,4 GHz','2,4 GHz'], ['5 GHz','5 GHz'], ['2,4 + 5 GHz','2,4 + 5 GHz'], ['Outra','Outra']];
const WIFI_STATUS = [['ativa','Ativa'], ['inativa','Inativa']];
const DEV_TYPES = [['repetidor','Repetidor'], ['access_point','Access point'], ['roteador','Roteador'], ['outro','Outro']];
const DEV_STATUS = [['ativo','Ativo'], ['inativo','Inativo'], ['manutencao','Em manutenção']];
const UFS = ['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const labelOf = (opts, v) => { const o = opts.find(x => x[0] === v); return o ? o[1] : (v || '—'); };
const statusTone = v => (v === 'ativo' || v === 'ativa') ? 'success' : v === 'manutencao' ? 'warn' : 'muted';
const IPV4 = /^((25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(25[0-5]|2[0-4]\d|1?\d?\d)$/;
const validIp = s => !s || IPV4.test(s.trim()) || (s.includes(':') && /^[0-9a-fA-F:]+$/.test(s.trim()));
const digitsOf = s => String(s || '').replace(/\D/g, '');
const maskCnpj = s => { const d = digitsOf(s).slice(0,14); return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2'); };
const maskCep = s => { const d = digitsOf(s).slice(0,8); return d.length > 5 ? d.slice(0,5) + '-' + d.slice(5) : d; };
function validCnpj(s){
  const d = digitsOf(s); if(d.length !== 14 || /^(\d)\1+$/.test(d)) return false;
  const calc = n => { let sum = 0, pos = n - 7; for(let i=0;i<n;i++){ sum += Number(d[i]) * pos--; if(pos < 2) pos = 9; } const r = sum % 11; return r < 2 ? 0 : 11 - r; };
  return calc(12) === Number(d[12]) && calc(13) === Number(d[13]);
}

function validateInfra(kind, it, db){
  const nm = (it.name || '').trim();
  if(kind === 'sites'){
    if(!nm) return 'Informe o nome do galpão ou unidade.';
    if(db.sites.some(s => s.id !== it.id && norm(s.name) === norm(nm))) return 'Já existe um galpão com esse nome.';
    if(it.cnpj && !validCnpj(it.cnpj)) return 'CNPJ inválido. Confira os 14 dígitos.';
    if(it.cep && digitsOf(it.cep).length !== 8) return 'CEP inválido: informe os 8 dígitos.';
    if(it.uf && !UFS.includes(it.uf)) return 'Selecione um estado (UF) válido.';
    if(it.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(it.email.trim())) return 'E-mail administrativo inválido.';
  }
  if(kind === 'internetLinks'){
    if(!nm) return 'Informe o nome ou a identificação da conexão.';
    if(!validIp(it.publicIp)) return 'IP público inválido.';
    if(it.installedAt && it.renewalAt && it.renewalAt < it.installedAt) return 'A data de vencimento/renovação não pode ser anterior à instalação.';
  }
  if(kind === 'wifiNetworks'){
    if(!(it.ssid || '').trim()) return 'Informe o nome da rede (SSID).';
    if(it.usageType === 'personalizada' && !(it.usageCustom || '').trim()) return 'Descreva o tipo de utilização personalizada.';
  }
  if(kind === 'netDevices'){
    if(!nm) return 'Informe o nome ou a identificação do dispositivo.';
    if(!validIp(it.mgmtIp)) return 'IP de gerenciamento inválido.';
  }
  return null;
}

/* ---------- cofre de senhas: desbloqueio sob demanda ---------- */
function useVaultGate(ctx){
  const [mode, setMode] = useState(null); const resolver = useRef(null);
  const ensure = ()=> new Promise(res => {
    if(ctx.vault.status === 'unlocked'){ res(true); return; }
    resolver.current = res; setMode(ctx.vault.status === 'none' ? 'create' : 'unlock');
  });
  const done = ok => { const r = resolver.current; resolver.current = null; setMode(null); if(r) r(ok); };
  const modal = mode ? <VaultModal ctx={ctx} mode={mode} onClose={()=>done(false)} onDone={()=>done(true)} /> : null;
  return { ensure, modal };
}

function VaultModal({ ctx, mode, onClose, onDone }){
  const [a, setA] = useState(''); const [b, setB] = useState(''); const [c, setC] = useState('');
  const [err, setErr] = useState(''); const [busy, setBusy] = useState(false);
  const titles = { create:'Criar senha mestra do cofre', unlock:'Desbloquear cofre de senhas', change:'Alterar senha mestra', reset:'Redefinir o cofre' };
  const submit = async ()=>{
    setErr('');
    try{
      setBusy(true);
      if(mode === 'create'){
        if(a.length < 8) throw new Error('Use pelo menos 8 caracteres.');
        if(a !== b) throw new Error('A confirmação não confere.');
        await ctx.vault.create(a); onDone();
      } else if(mode === 'unlock'){
        if(!(await ctx.vault.unlock(a))) throw new Error('Senha mestra incorreta.');
        onDone();
      } else if(mode === 'change'){
        if(b.length < 8) throw new Error('A nova senha precisa de pelo menos 8 caracteres.');
        if(b !== c) throw new Error('A confirmação não confere.');
        const e = await ctx.vault.rekey(a, b); if(e) throw new Error(e); onDone();
      } else if(mode === 'reset'){
        if(a.trim() !== 'REDEFINIR') throw new Error('Digite REDEFINIR para confirmar.');
        ctx.vault.reset(); onDone();
      }
    }catch(e){ setErr(e.message || String(e)); }
    finally{ setBusy(false); }
  };
  return (
    <Modal title={titles[mode]} onClose={onClose} width={480} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className={mode === 'reset' ? 'btn btn-danger' : 'btn btn-primary'} onClick={submit} disabled={busy}>{busy ? 'Aguarde...' : mode === 'create' ? 'Criar cofre' : mode === 'unlock' ? 'Desbloquear' : mode === 'change' ? 'Alterar' : 'Redefinir e apagar senhas'}</button></React.Fragment>
    }>
      {mode === 'create' && <React.Fragment>
        <p style={{ fontSize:12.5, color:'var(--text-muted)', lineHeight:1.6, margin:'0 0 12px' }}>As senhas de Wi-Fi são <strong>criptografadas</strong> antes de ir para o banco, usando esta senha mestra. Ela <strong>não é salva em lugar nenhum</strong>: se for esquecida, as senhas guardadas não podem ser recuperadas (só redefinidas e digitadas de novo). Compartilhe-a apenas com quem pode ver as senhas.</p>
        <Field label="Senha mestra"><input type="password" value={a} onChange={e=>setA(e.target.value)} autoFocus /></Field>
        <Field label="Confirmar senha mestra"><input type="password" value={b} onChange={e=>setB(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') submit(); }} /></Field></React.Fragment>}
      {mode === 'unlock' && <Field label="Senha mestra" hint="O cofre bloqueia sozinho após 10 minutos sem uso."><input type="password" value={a} onChange={e=>setA(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') submit(); }} autoFocus /></Field>}
      {mode === 'change' && <React.Fragment>
        <Field label="Senha mestra atual"><input type="password" value={a} onChange={e=>setA(e.target.value)} autoFocus /></Field>
        <Field label="Nova senha mestra"><input type="password" value={b} onChange={e=>setB(e.target.value)} /></Field>
        <Field label="Confirmar nova senha"><input type="password" value={c} onChange={e=>setC(e.target.value)} /></Field></React.Fragment>}
      {mode === 'reset' && <React.Fragment>
        <p style={{ fontSize:12.5, color:'#F0B3B3', lineHeight:1.6, margin:'0 0 12px' }}>Use apenas se a senha mestra foi esquecida. <strong>Todas as senhas de Wi-Fi salvas serão apagadas</strong> (o restante dos cadastros é mantido) e será preciso criar uma nova senha mestra e digitar as senhas de novo.</p>
        <Field label="Digite REDEFINIR para confirmar"><input value={a} onChange={e=>setA(e.target.value)} autoFocus /></Field></React.Fragment>}
      {err && <div style={{ fontSize:12.5, color:'#F0B3B3', marginTop:4 }}>{err}</div>}
    </Modal>
  );
}

/* senha oculta por padrão (sempre ••••••••, sem revelar o tamanho); volta a ocultar ao sair da tela */
function PasswordCell({ ctx, packed }){
  const [shown, setShown] = useState(null); const gate = useVaultGate(ctx);
  useEffect(()=>{ setShown(null); }, [packed]);
  useEffect(()=>{ if(ctx.vault.status !== 'unlocked') setShown(null); }, [ctx.vault.status]);
  if(!packed) return <span style={{ color:'var(--text-faint)' }}>—</span>;
  const read = async ()=>{
    if(!(await gate.ensure())) return null;
    const t = await ctx.vault.decrypt(packed);
    if(t === null) ctx.notify('Não foi possível ler esta senha (cofre diferente ou dado corrompido).', 'error');
    return t;
  };
  const toggle = async ()=>{ if(shown !== null){ setShown(null); return; } const t = await read(); if(t !== null) setShown(t); };
  const copy = async ()=>{ const t = shown !== null ? shown : await read(); if(t === null) return; try{ await navigator.clipboard.writeText(t); ctx.notify('Senha copiada.', 'success'); }catch(e){ ctx.notify('Não foi possível copiar automaticamente.', 'error'); } };
  return (
    <span style={{ display:'inline-flex', alignItems:'center', gap:4 }}>
      <code style={{ fontSize:12.5, background:'var(--surface-2)', padding:'2px 7px', borderRadius:6, letterSpacing: shown !== null ? 0 : 1 }}>{shown !== null ? shown : '••••••••'}</code>
      <button className="btn btn-ghost btn-sm" style={{ padding:4 }} title={shown !== null ? 'Ocultar senha' : 'Mostrar senha'} aria-label={shown !== null ? 'Ocultar senha' : 'Mostrar senha'} onClick={toggle}><Icon path={shown !== null ? ICONS.eyeOff : ICONS.eye} size={14}/></button>
      <button className="btn btn-ghost btn-sm" style={{ padding:4 }} title="Copiar senha" aria-label="Copiar senha" onClick={copy}><Icon path={ICONS.copy} size={13}/></button>
      {gate.modal}
    </span>
  );
}

/* campo de senha nos formulários: null = manter a senha atual */
function PasswordInput({ ctx, existing, value, onChange }){
  const [visible, setVisible] = useState(false); const gate = useVaultGate(ctx);
  const keeping = value === null && !!existing;
  const reveal = async ()=>{
    if(visible){ setVisible(false); return; }
    if(keeping){
      if(!(await gate.ensure())) return;
      const t = await ctx.vault.decrypt(existing);
      if(t === null){ ctx.notify('Não foi possível ler a senha atual.', 'error'); return; }
      onChange(t);
    }
    setVisible(true);
  };
  return (
    <div style={{ display:'flex', gap:6, alignItems:'center' }}>
      <input type={visible ? 'text' : 'password'} value={keeping ? '••••••••' : (value || '')} readOnly={keeping} placeholder="Senha da rede" onChange={e=>onChange(e.target.value)} autoComplete="new-password" />
      {keeping && <button type="button" className="btn btn-soft btn-sm" onClick={()=>{ onChange(''); setVisible(false); }}>Alterar</button>}
      {!keeping && existing && <button type="button" className="btn btn-ghost btn-sm" onClick={()=>{ onChange(null); setVisible(false); }}>Manter atual</button>}
      <button type="button" className="btn btn-ghost btn-sm" style={{ padding:6 }} title={visible ? 'Ocultar senha' : 'Mostrar senha'} aria-label={visible ? 'Ocultar senha' : 'Mostrar senha'} onClick={reveal}><Icon path={visible ? ICONS.eyeOff : ICONS.eye} size={14}/></button>
      {gate.modal}
    </div>
  );
}

function InfraFormModal({ ctx, kind, site, item, onClose }){
  const { db, actions } = ctx; const cfg = INFRA[kind];
  const [f, setF] = useState(()=> ({ ...cfg.defaults, ...(item || {}) }));
  const [pwd, setPwd] = useState(null);       // null = manter a senha atual
  const [busy, setBusy] = useState(false);
  const gate = useVaultGate(ctx);
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const siteWifi = db.wifiNetworks.filter(w => w.siteId === site.id);
  const submit = async ()=>{
    setBusy(true);
    try{
      let passwordEnc = item ? (item.passwordEnc || '') : '';
      let ssid = f.ssid;
      const usesOwn = kind === 'wifiNetworks' || (kind === 'netDevices' && !f.wifiId);
      if(kind === 'netDevices' && f.wifiId){ passwordEnc = ''; ssid = ''; }
      else if(usesOwn && pwd !== null){
        if(pwd === '') passwordEnc = '';
        else {
          if(!(await gate.ensure())) return;
          const enc = await ctx.vault.encrypt(pwd);
          if(!enc){ ctx.notify('Cofre bloqueado: desbloqueie para salvar a senha.', 'error'); return; }
          passwordEnc = enc;
        }
      }
      const id = actions.saveInfra(kind, { ...(item || {}), ...f, ssid, siteId: site.id, passwordEnc, wifiId: f.wifiId || null });
      if(id) onClose();
    } finally { setBusy(false); }
  };
  return (
    <Modal title={`${item ? 'Editar' : 'Nova'} ${cfg.single} — ${site.name}`} onClose={onClose} width={720} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={submit} disabled={busy}>{item ? 'Salvar alterações' : 'Cadastrar'}</button></React.Fragment>
    }>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 14px' }}>
        {cfg.fields.filter(fl => !fl.showIf || fl.showIf(f)).map((fl, idx) => (
          <div key={fl.k} style={{ gridColumn: fl.span === 2 ? '1 / -1' : 'auto' }}>
            <Field label={fl.label}>
              {fl.type === 'select' ? <select value={f[fl.k] || ''} onChange={e=>set(fl.k, e.target.value)}>{fl.opts.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}</select>
                : fl.type === 'wifi' ? <select value={f.wifiId || ''} onChange={e=>set('wifiId', e.target.value)}><option value="">Rede própria do dispositivo (não compartilha)</option>{siteWifi.map(w => <option key={w.id} value={w.id}>Compartilha: {w.ssid}</option>)}</select>
                : fl.type === 'password' ? <PasswordInput ctx={ctx} existing={item ? item.passwordEnc : ''} value={pwd} onChange={setPwd} />
                : fl.type === 'textarea' ? <textarea rows={3} value={f[fl.k] || ''} onChange={e=>set(fl.k, e.target.value)} />
                : fl.type === 'date' ? <input type="date" value={f[fl.k] || ''} onChange={e=>set(fl.k, e.target.value)} />
                : <input value={f[fl.k] || ''} onChange={e=>set(fl.k, e.target.value)} placeholder={fl.ph || ''} autoFocus={idx === 0} />}
            </Field>
          </div>
        ))}
      </div>
      {kind === 'netDevices' && f.wifiId && <div style={{ fontSize:12, color:'var(--text-faint)' }}>O dispositivo usa o nome e a senha da rede compartilhada selecionada.</div>}
      {gate.modal}
    </Modal>
  );
}

function InfraList({ ctx, kind, site }){
  const { db, actions, askConfirm, notify } = ctx; const cfg = INFRA[kind];
  const [q, setQ] = useState(''); const [fStatus, setFStatus] = useState(''); const [editing, setEditing] = useState(undefined);
  const nq = norm(q.trim());
  const rows = db[kind].filter(r => r.siteId === site.id)
    .filter(r => !fStatus || r.status === fStatus)
    .filter(r => !nq || norm(cfg.fields.filter(fl => fl.type !== 'password').map(fl => r[fl.k]).join(' ')).includes(nq));
  const exportCsv = ()=>{ if(!ctx.isAdmin) return;
    const fl = cfg.fields.filter(x => x.type !== 'password');
    const val = (r, x) => x.type === 'select' ? labelOf(x.opts, r[x.k]) : x.type === 'wifi' ? ((db.wifiNetworks.find(w => w.id === r.wifiId) || {}).ssid || '') : x.type === 'date' ? fmtDate(r[x.k]) : r[x.k];
    const lines = [fl.map(x => csvEscape(x.label.replace(' *',''))).join(';')].concat(rows.map(r => fl.map(x => csvEscape(val(r, x))).join(';')));
    downloadBlob(new Blob(['\ufeff' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }), `${site.name}_${kind}.csv`);
    notify('Exportado sem as senhas.', 'success');
  };
  return (
    <div>
      {cfg.password && <VaultBar ctx={ctx} />}
      <div style={{ display:'flex', gap:10, marginBottom:12, flexWrap:'wrap' }}>
        <input placeholder="Pesquisar..." value={q} onChange={e=>setQ(e.target.value)} style={{ maxWidth:280 }} />
        <select value={fStatus} onChange={e=>setFStatus(e.target.value)} style={{ maxWidth:190 }}><option value="">Todos os status</option>{cfg.statusOpts.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}</select>
        <div style={{ flex:1 }} />
        {ctx.isAdmin && <button className="btn btn-soft btn-sm" onClick={exportCsv}><Icon path={ICONS.download} size={14}/> Exportar CSV</button>}
        {ctx.can('infra','edit') && <button className="btn btn-primary btn-sm" onClick={()=>setEditing(null)}>{cfg.add}</button>}
      </div>
      <div className="card" style={{ overflowX:'auto' }}>
        <table>
          <thead><tr>{cfg.cols.map(c => <th key={c[0]}>{c[0]}</th>)}<th>Status</th><th>Última alteração</th><th></th></tr></thead>
          <tbody>
            {rows.map(r => (
              <tr key={r.id}>
                {cfg.cols.map((c,i) => <td key={c[0]} style={{ fontWeight: i === 0 ? 600 : 400 }}>{c[1](r, ctx)}</td>)}
                <td><StatusBadge tone={statusTone(r.status)}>{labelOf(cfg.statusOpts, r.status)}</StatusBadge></td>
                <td style={{ fontSize:11.5, color:'var(--text-faint)' }}>{updInfo(r)}</td>
                <td><div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>
                  {ctx.can('infra','edit') && <button className="btn btn-ghost btn-sm" title="Editar" onClick={()=>setEditing(r)}><Icon path={ICONS.edit} size={13}/></button>}
                  {ctx.can('infra','edit') && <button className="btn btn-ghost btn-sm" title="Excluir" onClick={()=>askConfirm({ title:`Excluir ${cfg.single}`, tone:'danger', confirmLabel:'Excluir', message:`Excluir "${r.name || r.ssid}" do ${site.name}? Esta ação não pode ser desfeita.`, onConfirm:()=>actions.deleteInfra(kind, r.id) })}><Icon path={ICONS.trash} size={13}/></button>}
                </div></td>
              </tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={cfg.cols.length + 3}><EmptyState text={`Nenhum(a) ${cfg.single} cadastrado(a) neste galpão.`} /></td></tr>}
          </tbody>
        </table>
      </div>
      {editing !== undefined && <InfraFormModal ctx={ctx} kind={kind} site={site} item={editing} onClose={()=>setEditing(undefined)} />}
    </div>
  );
}

function SiteSectionForm({ ctx, site, fields }){
  const pick = s => { const o = {}; fields.forEach(fl => { o[fl.k] = s[fl.k] || ''; }); return o; };
  const [f, setF] = useState(()=> pick(site));
  const [busyCep, setBusyCep] = useState(false);
  useEffect(()=>{ setF(pick(site)); }, [site.id]);
  const dirty = fields.some(fl => (f[fl.k] || '') !== (site[fl.k] || ''));
  const set = (fl, v) => setF(prev => ({ ...prev, [fl.k]: fl.mask ? fl.mask(v) : v }));
  const save = ()=>{ if(ctx.actions.saveInfra('sites', { ...site, ...f })) { /* o estado é atualizado pelo banco local */ } };
  const lookupCep = async ()=>{
    const d = digitsOf(f.cep); if(d.length !== 8){ ctx.notify('Informe os 8 dígitos do CEP.', 'error'); return; }
    setBusyCep(true);
    try{
      const res = await fetch(`https://viacep.com.br/ws/${d}/json/`); const j = await res.json();
      if(j.erro) throw new Error('CEP não encontrado.');
      setF(prev => ({ ...prev, uf: j.uf || prev.uf, city: j.localidade || prev.city, district: j.bairro || prev.district, street: j.logradouro || prev.street }));
      ctx.notify('Endereço preenchido pelo CEP. Confira e salve.', 'success');
    }catch(e){ ctx.notify('Não foi possível buscar o CEP (' + (e.message || 'sem internet') + '). Preencha manualmente.', 'error'); }
    finally{ setBusyCep(false); }
  };
  return (
    <fieldset disabled={!ctx.can('infra','edit')} className="card" style={{ padding:18, margin:0, minWidth:0 }}>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:'0 16px' }}>
        {fields.map(fl => (
          <div key={fl.k} style={{ gridColumn: fl.span === 2 ? '1 / -1' : 'auto' }}>
            <Field label={fl.label}>
              {fl.type === 'select' ? <select value={f[fl.k]} onChange={e=>set(fl, e.target.value)}>{fl.opts.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}</select>
                : fl.type === 'textarea' ? <textarea rows={fl.rows || 3} value={f[fl.k]} onChange={e=>set(fl, e.target.value)} placeholder={fl.ph || ''} />
                : fl.type === 'date' ? <input type="date" value={f[fl.k]} onChange={e=>set(fl, e.target.value)} />
                : fl.cepLookup ? <div style={{ display:'flex', gap:6 }}><input value={f[fl.k]} onChange={e=>set(fl, e.target.value)} placeholder={fl.ph} /><button type="button" className="btn btn-soft btn-sm" onClick={lookupCep} disabled={busyCep}>{busyCep ? '...' : 'Buscar CEP'}</button></div>
                : <input value={f[fl.k]} onChange={e=>set(fl, e.target.value)} placeholder={fl.ph || ''} />}
            </Field>
          </div>
        ))}
      </div>
      <div className={`form-actions ${dirty ? 'dirty' : ''}`} style={{ display:'flex', gap:8, alignItems:'center', marginTop:4 }}>
        <button className="btn btn-primary" onClick={save} disabled={!dirty}>Salvar alterações</button>
        <button className="btn btn-ghost" onClick={()=>setF(pick(site))} disabled={!dirty}>Cancelar edição</button>
        <span style={{ fontSize:12, color:'var(--text-faint)', marginLeft:8 }}>{dirty ? 'Há alterações não salvas.' : `Última alteração: ${updInfo(site)}`}</span>
      </div>
    </fieldset>
  );
}

      </div>}>
