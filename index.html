    message:`Excluir ${u.name || u.email}? O login dele deixa de existir. O histórico de movimentações não é apagado. Para só bloquear o acesso, use "Editar" e desmarque "ativo".`,
    onConfirm: async ()=>{ const r = await callUserAdmin(ctx, { action:'delete', userId: u.id }); if(r.ok){ notify('Usuário excluído.', 'success'); load(); } else notify(r.message, 'error'); } });
  return (
    <div className="fade-up">
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', flexWrap:'wrap', gap:10, marginBottom:16 }}>
        <div>
          <h1 style={{ fontSize:24, margin:'0 0 4px', fontWeight:600 }}>Usuários</h1>
          <div style={{ color:'var(--text-muted)', fontSize:13 }}>Quem pode entrar no sistema e o que cada um acessa. Administradores têm acesso a tudo.</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={()=>setEditing(null)}><Icon path={ICONS.plus} size={14}/> Novo usuário</button>
      </div>
      {loadErr && <div className="card" style={{ padding:14, marginBottom:14, color:'#F0B3B3', fontSize:13 }}>{loadErr}</div>}
      <div className="card" style={{ overflowX:'auto' }}>
        <table>
          <thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Status</th><th>Acesso</th><th></th></tr></thead>
          <tbody>
            {users === null && !loadErr && <tr><td colSpan={6} style={{ color:'var(--text-muted)' }}>Carregando...</td></tr>}
            {users && users.map(u => (
              <tr key={u.id}>
                <td style={{ fontWeight:600 }}>{u.name || '—'}{u.id === me.id && <span style={{ marginLeft:6, fontSize:11, color:'var(--text-faint)', fontWeight:400 }}>(você)</span>}</td>
                <td style={{ color:'var(--text-muted)' }}>{u.email}</td>
                <td><StatusBadge tone={u.role === 'admin' ? 'accent' : 'muted'}>{u.role === 'admin' ? 'Administrador' : 'Usuário'}</StatusBadge></td>
                <td><StatusBadge tone={u.active ? 'success' : 'danger'}>{u.active ? 'Ativo' : 'Inativo'}</StatusBadge></td>
                <td style={{ color:'var(--text-muted)', fontSize:12.5, maxWidth:320 }}>{permSummary(u)}</td>
                <td><div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>
                  <button className="btn btn-ghost btn-sm" title="Editar permissões" onClick={()=>setEditing(u)}><Icon path={ICONS.edit} size={13}/></button>
                  <button className="btn btn-ghost btn-sm" title="Trocar senha" onClick={()=>setPwUser(u)}><Icon path={ICONS.lock} size={13}/></button>
                  {u.id !== me.id && <button className="btn btn-ghost btn-sm" title="Excluir" onClick={()=>remove(u)}><Icon path={ICONS.trash} size={13}/></button>}
                </div></td>
              </tr>
            ))}
            {users && users.length === 0 && <tr><td colSpan={6}><EmptyState text="Nenhum usuário." /></td></tr>}
          </tbody>
        </table>
      </div>
      {editing !== undefined && <UserFormModal ctx={ctx} user={editing} onClose={()=>setEditing(undefined)} onSaved={load} />}
      {pwUser && <UserPasswordModal ctx={ctx} user={pwUser} onClose={()=>setPwUser(null)} />}
    </div>
  );
}
function NoAccess({ ctx }){
  const none = !PERM_MODULES.some(([m]) => canDo(ctx.me, m));
  return <div className="fade-up"><div className="card" style={{ padding:24, maxWidth:520 }}>
    <h2 style={{ margin:'0 0 8px', fontSize:17, fontWeight:600 }}>{none ? 'Nenhum módulo liberado' : 'Sem acesso a esta área'}</h2>
    <div style={{ fontSize:13, color:'var(--text-muted)', lineHeight:1.6 }}>{none ? 'O seu usuário ainda não tem acesso a nenhum módulo. Peça ao administrador para liberar.' : 'O seu usuário não tem permissão para ver esta área. Se precisar, peça ao administrador.'}</div>
  </div></div>;
}

function App({ client: authClient, me, config: appConfig, onSignOut, onConnect, onDisconnect, onRefreshMe }){
  const [db, setDb] = useState(()=> createEmptyDb());
  const [screen, setScreen] = useState(()=> ({ name: firstScreenFor(me), params:{} }));
  const [toasts, setToasts] = useState([]);
  const [modal, setModal] = useState(null);
  const [syncStatus, setSyncStatus] = useState('local'); // local | connecting | connected | error
  const [syncError, setSyncError] = useState('');
  const sbClientRef = useRef(null);
  const pendingWritesRef = useRef(0);
  const dbRef = useRef(db); dbRef.current = db;
  const queueRef = useRef(Promise.resolve());

  const notify = useCallback((message, tone='info')=>{
    const id = uid('toast');
    setToasts(t => [...t, { id, message, tone }]);
    setTimeout(()=> setToasts(t => t.filter(x => x.id !== id)), tone==='error' ? 6000 : 3400);
  }, []);
  const [navOpen, setNavOpen] = useState(false);   // menu lateral aberto (só no celular)
  useMobileUi();
  const navigate = useCallback((name, params={})=>{ setScreen({ name, params }); setNavOpen(false); window.scrollTo(0,0); }, []);
  useEffect(()=>{ document.body.style.overflow = navOpen ? 'hidden' : ''; return ()=>{ document.body.style.overflow = ''; }; }, [navOpen]);

  /* ---- operador (quem está alterando) e cofre de senhas: ficam só na memória/sessão ---- */
  const [operator, setOperatorState] = useState(()=> me.name || me.email || '');   // quem altera = quem está logado
  const setOperator = v => setOperatorState(v);
  const vaultKeyRef = useRef(null); const idleRef = useRef(null);
  const [vaultUnlocked, setVaultUnlocked] = useState(false);
  const lockVault = useCallback(()=>{ vaultKeyRef.current = null; if(idleRef.current) clearTimeout(idleRef.current); setVaultUnlocked(false); }, []);
  const touchVault = useCallback(()=>{ if(idleRef.current) clearTimeout(idleRef.current); idleRef.current = setTimeout(lockVault, VAULT_IDLE_MS); }, [lockVault]);

  /* ---- conexão com o banco (o login já foi feito; o cliente carrega a sessão do usuário) ---- */
  useEffect(()=>{
    let cancelled = false;
    setSyncStatus('connecting');
    (async ()=>{
      try{
        await testSbConnection(authClient);
        const remote = await fetchRemoteDB(authClient);
        if(cancelled) return;
        sbClientRef.current = authClient;
        setDb(remote); setSyncStatus('connected'); setSyncError('');
      }catch(err){
        if(cancelled) return;
        console.error(err);
        sbClientRef.current = null; setSyncStatus('error');
        setSyncError((err && err.message) ? err.message : 'Falha ao conectar. Confira a URL, a chave e se o schema.sql foi executado.');
      }
    })();
    return ()=>{ cancelled = true; };
  }, [authClient]);

  const connectDb = useCallback((cfg)=>{ onConnect(cfg); }, [onConnect]);
  const disconnectDb = useCallback(()=>{ lockVault(); onDisconnect(); }, [lockVault, onDisconnect]);

  const refreshFromDb = useCallback(async (silent)=>{
    const client = sbClientRef.current;
    if(!client) return;
    if(pendingWritesRef.current > 0){ if(!silent) notify('Aguardando uma gravação em andamento...', 'info'); return; }
    try{
      const remote = await fetchRemoteDB(client);
      if(pendingWritesRef.current > 0) return;
      (remote.acceptances || []).filter(a => a.status === 'aceito' && (dbRef.current.acceptances || []).some(p => p.id === a.id && p.status !== 'aceito')).forEach(a => {
        const t = remote.terms.find(x => x.id === a.termId);
        notify(`${a.acceptedName || a.recipientName} aceitou digitalmente o termo ${t ? t.number : ''}.`, 'success');
      });
      setDb(remote);
      if(!silent) notify('Dados atualizados a partir do banco.', 'success');
    }catch(err){ console.error(err); if(!silent) notify('Não foi possível atualizar agora: ' + (err.message || err), 'error'); }
  }, [notify]);

  useEffect(()=>{
    if(syncStatus !== 'connected') return;
    const iv = setInterval(()=>{ refreshFromDb(true); if(onRefreshMe) onRefreshMe(); }, 15000);
    return ()=> clearInterval(iv);
  }, [syncStatus, refreshFromDb, onRefreshMe]);

  /* Fila serial de escritas (respeita as chaves estrangeiras) e pausa o polling.
     Se uma gravação falhar, avisa e recarrega do banco: a tela nunca mostra o que não foi salvo. */
  const sbPersist = useCallback((fn)=>{
    const client = sbClientRef.current;
    if(!client){ notify('Sem conexão com o banco: nada foi salvo. Conecte em "Banco de dados".', 'error'); return; }
    pendingWritesRef.current += 1;
    let failed = false;
    queueRef.current = queueRef.current
      .then(()=> fn(client))
      .catch(err => { failed = true; console.error(err); notify('NÃO foi salvo no banco: ' + (err.message || err) + (/sector/i.test(String(err.message || err)) ? ' — O banco precisa ser atualizado para os setores: rode o arquivo schema.sql no SQL Editor do Supabase.' : ''), 'error'); })
      .finally(()=>{ pendingWritesRef.current = Math.max(0, pendingWritesRef.current - 1); if(failed) refreshFromDb(true); });
  }, [notify, refreshFromDb]);

  /* ---- ações ---- */
  const actions = useMemo(()=>{
    const A = {};
    const useCount = (kind, id) => {
      if(kind === 'categories') return db.products.filter(p => p.categoryId === id).length;
      if(kind === 'products') return db.equipments.filter(e => e.productId === id).length;
      if(kind === 'locations') return db.equipments.filter(e => e.locationId === id).length;
      if(kind === 'sectors') return db.equipments.filter(e => e.sectorId === id).length;
      if(kind === 'responsibles') return db.equipments.filter(e => e.responsibleId === id).length;
      return 0;
    };
    A.useCount = useCount;

    A.saveItem = (kind, item)=>{
      const err = validateItem(kind, item, db);
      if(err){ notify(err, 'error'); return false; }
      const isNew = !item.id;
      const obj = { ...item, id: item.id || uid(kind.slice(0,3)) };
      if(typeof obj.name === 'string') obj.name = obj.name.trim();
      setDb(prev => ({ ...prev, [kind]: isNew ? [...prev[kind], obj] : prev[kind].map(x => x.id === obj.id ? obj : x) }));
      sbPersist(c => sbUpsertRow(c, kind, obj));
      notify(isNew ? 'Cadastro criado.' : 'Cadastro atualizado.', 'success');
      return obj.id;
    };

    A.saveEquipment = (item, note, forcedType)=>{
      const err = validateItem('equipments', item, db);
      if(err){ notify(err, 'error'); return false; }
      const old = item.id ? db.equipments.find(e => e.id === item.id) : null;
      const eq = { ...item, id: item.id || uid('eqp'), patrimony: item.patrimony.trim(), serial: (item.serial||'').trim(),
        locationId: item.locationId || null, sectorId: item.sectorId || null, responsibleId: item.responsibleId || null, acquiredAt: item.acquiredAt || null,
        notes: item.notes || '', createdAt: old ? old.createdAt : Date.now() };
      { const sec = eq.sectorId ? (db.sectors || []).find(x => x.id === eq.sectorId) : null;
        if(sec && sec.locationId && sec.locationId !== eq.locationId) eq.sectorId = null; }   // o setor é de outro local (ex.: devolução em outro galpão): sai do setor, e o histórico registra
      let mv = null;
      if(!old) mv = buildMovement(db, null, eq, 'Cadastro', note);
      else { const t = forcedType || detectMovementType(old, eq); if(t) mv = buildMovement(db, old, eq, t, note); }
      setDb(prev => ({ ...prev,
        equipments: old ? prev.equipments.map(e => e.id === eq.id ? eq : e) : [...prev.equipments, eq],
        movements: mv ? [mv, ...prev.movements] : prev.movements }));
      sbPersist(async c => { await sbUpsertRow(c, 'equipments', eq); if(mv) await sbUpsertRow(c, 'movements', mv); });
      notify(old ? (mv && mv.type !== 'Cadastro' ? `${mv.type} registrada.` : 'Equipamento atualizado.') : 'Equipamento cadastrado.', 'success');
      return eq.id;
    };

    A.deleteItem = (kind, id)=>{
      if(kind === 'terms'){
        const t = db.terms.find(x => x.id === id);
        const attFiles = db.attachments.filter(a => a.termId === id).map(a => a.filePath);
        setDb(prev => ({ ...prev, terms: prev.terms.filter(x => x.id !== id), attachments: prev.attachments.filter(a => a.termId !== id), acceptances: (prev.acceptances || []).filter(a => a.termId !== id) }));
        sbPersist(async c => {
          const files = [...new Set([...(t ? [t.filePath, t.signedFilePath] : []), ...attFiles].filter(Boolean))];
          if(files.length){ const r = await c.storage.from('termos').remove(files); if(r.error) console.warn('Arquivo não removido do Storage', r.error); }
          await sbDeleteRow(c, 'terms', id);
        });
        notify('Termo excluído.', 'success'); return true;
      }
      if(kind === 'locations'){
        const ns = (db.sectors || []).filter(x => x.locationId === id).length;
        if(ns > 0){ notify(`Não é possível excluir: este local tem ${ns} setor(es) cadastrado(s). Exclua ou mude os setores antes.`, 'error'); return false; }
      }
      const n = useCount(kind, id);
      if(n > 0){
        const what = { categories:'produto(s)', products:'equipamento(s)', locations:'equipamento(s)', sectors:'equipamento(s)', responsibles:'equipamento(s)' }[kind];
        notify(`Não é possível excluir: está em uso por ${n} ${what}.`, 'error'); return false;
      }
      setDb(prev => {
        const next = { ...prev, [kind]: prev[kind].filter(x => x.id !== id) };
        if(kind === 'equipments'){
          next.movements = prev.movements.filter(m => m.equipmentId !== id);
          next.terms = prev.terms.map(t => t.equipmentId === id ? { ...t, equipmentId: null } : t);
        }
        return next;
      });
      sbPersist(c => sbDeleteRow(c, kind, id));
      notify('Registro excluído.', 'success'); return true;
    };

    A.updateTerm = (term)=>{
      setDb(prev => ({ ...prev, terms: prev.terms.map(t => t.id === term.id ? term : t) }));
      sbPersist(c => sbUpsertRow(c, 'terms', term));
      return true;
    };

    /* Arquivo assinado: cada anexo salvo vira um registro (backup); o mais recente é o "atual" do termo. */
    A.addAttachment = (att)=>{
      const t = db.terms.find(x => x.id === att.termId); if(!t) return false;
      const upd = { ...t, signedFilePath: att.filePath, signedFileUrl: att.fileUrl, signedFileName: att.fileName, signedAt: att.createdAt };
      setDb(prev => ({ ...prev, attachments: [att, ...prev.attachments], terms: prev.terms.map(x => x.id === t.id ? upd : x) }));
      sbPersist(async c => { await sbUpsertRow(c, 'attachments', att); await sbUpsertRow(c, 'terms', upd); });
      return true;
    };
    A.deleteAttachment = (id)=>{
      const att = db.attachments.find(a => a.id === id); if(!att) return false;
      const t = db.terms.find(x => x.id === att.termId);
      const latest = db.attachments.filter(a => a.termId === att.termId && a.id !== id).sort((a,b) => b.createdAt - a.createdAt)[0];
      const upd = t ? { ...t, signedFilePath: latest ? latest.filePath : '', signedFileUrl: latest ? latest.fileUrl : '', signedFileName: latest ? latest.fileName : '', signedAt: latest ? latest.createdAt : null } : null;
      setDb(prev => ({ ...prev, attachments: prev.attachments.filter(a => a.id !== id), terms: upd ? prev.terms.map(x => x.id === upd.id ? upd : x) : prev.terms }));
      sbPersist(async c => {
        const r = await c.storage.from('termos').remove([att.filePath]); if(r.error) console.warn('Arquivo não removido do Storage', r.error);
        await sbDeleteRow(c, 'attachments', id);
        if(upd) await sbUpsertRow(c, 'terms', upd);
      });
      notify('Arquivo assinado excluído.', 'success'); return true;
    };

    A.addTerm = (term)=>{
      setDb(prev => ({ ...prev, terms: [term, ...prev.terms] }));
      sbPersist(c => sbUpsertRow(c, 'terms', term));
      return true;
    };

    A.saveSettings = (s)=>{
      const settings = { orgName: (s.orgName||'').trim(), city: (s.city||'').trim() };
      setDb(prev => ({ ...prev, settings }));
      sbPersist(c => sbUpsertSettings(c, settings));
      notify('Dados da organização salvos.', 'success');
    };

    /* ---- Informações administrativas de TI ---- */
    const infraPrefix = { sites:'site', internetLinks:'lnk', wifiNetworks:'wifi', netDevices:'dev' };
    A.saveInfra = (kind, item)=>{
      if(!operator.trim()){ notify('Informe seu nome no campo "Alterando como" (topo da tela) para registrar quem fez a alteração.', 'error'); return false; }
      const err = validateInfra(kind, item, db);
      if(err){ notify(err, 'error'); return false; }
      const isNew = !item.id; const now = Date.now();
      const obj = { ...item, id: item.id || uid(infraPrefix[kind]), createdAt: item.createdAt || now, updatedAt: now, updatedBy: operator.trim() };
      ['name','ssid'].forEach(k => { if(typeof obj[k] === 'string') obj[k] = obj[k].trim(); });
      setDb(prev => ({ ...prev, [kind]: isNew ? [...prev[kind], obj] : prev[kind].map(x => x.id === obj.id ? obj : x) }));
      sbPersist(c => sbUpsertRow(c, kind, obj));
      notify(isNew ? 'Registro criado e salvo no banco.' : 'Alterações salvas no banco.', 'success');
      return obj.id;
    };
    A.deleteInfra = (kind, id)=>{
      setDb(prev => {
        const next = { ...prev, [kind]: prev[kind].filter(x => x.id !== id) };
        if(kind === 'sites'){ ['internetLinks','wifiNetworks','netDevices'].forEach(k => { next[k] = prev[k].filter(x => x.siteId !== id); }); }
        if(kind === 'wifiNetworks'){ next.netDevices = prev.netDevices.map(d => d.wifiId === id ? { ...d, wifiId: null } : d); }
        return next;
      });
      sbPersist(c => sbDeleteRow(c, kind, id));
      notify('Registro excluído.', 'success'); return true;
    };
    A.vaultCreate = async (pass)=>{
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      const key = await deriveKey(pass, salt);
      const v = { salt, verifier: await encryptText(key, VAULT_CHECK) };
      setDb(prev => ({ ...prev, vault: v })); sbPersist(c => sbUpsertVault(c, v));
      vaultKeyRef.current = key; setVaultUnlocked(true); touchVault(); return true;
    };
    A.vaultUnlock = async (pass)=>{
      if(!db.vault) return false;
      try{
        const key = await deriveKey(pass, db.vault.salt);
        if(await decryptText(key, db.vault.verifier) !== VAULT_CHECK) return false;
        vaultKeyRef.current = key; setVaultUnlocked(true); touchVault(); return true;
      }catch(e){ return false; }
    };
    A.vaultEncrypt = async (text)=>{ if(!vaultKeyRef.current) return null; touchVault(); return encryptText(vaultKeyRef.current, text); };
    A.vaultDecrypt = async (packed)=>{ if(!vaultKeyRef.current || !packed) return null; touchVault(); try{ return await decryptText(vaultKeyRef.current, packed); }catch(e){ return null; } };
    A.vaultRekey = async (oldPass, newPass)=>{
      if(!db.vault) return 'O cofre ainda não foi criado.';
      let oldKey;
      try{ oldKey = await deriveKey(oldPass, db.vault.salt); if(await decryptText(oldKey, db.vault.verifier) !== VAULT_CHECK) throw new Error('x'); }
      catch(e){ return 'Senha mestra atual incorreta.'; }
      const salt = b64(crypto.getRandomValues(new Uint8Array(16)));
      const newKey = await deriveKey(newPass, salt);
      const rewrap = rows => Promise.all(rows.map(async r => r.passwordEnc ? { ...r, passwordEnc: await encryptText(newKey, await decryptText(oldKey, r.passwordEnc)) } : r));
      let wifi, devs;
      try{ wifi = await rewrap(db.wifiNetworks); devs = await rewrap(db.netDevices); }
      catch(e){ return 'Alguma senha salva não pôde ser lida com a senha atual; nada foi alterado.'; }
      const v = { salt, verifier: await encryptText(newKey, VAULT_CHECK) };
      setDb(prev => ({ ...prev, vault: v, wifiNetworks: wifi, netDevices: devs }));
      sbPersist(async c => {
        for(const r of wifi.filter(x => x.passwordEnc)) await sbUpsertRow(c, 'wifiNetworks', r);
        for(const r of devs.filter(x => x.passwordEnc)) await sbUpsertRow(c, 'netDevices', r);
        await sbUpsertVault(c, v);
      });
      vaultKeyRef.current = newKey; setVaultUnlocked(true); touchVault();
      notify('Senha mestra alterada e senhas recriptografadas.', 'success'); return null;
    };
    A.vaultReset = ()=>{
      const had = r => !!r.passwordEnc;
      const wifi = db.wifiNetworks.map(r => had(r) ? { ...r, passwordEnc: '' } : r);
      const devs = db.netDevices.map(r => had(r) ? { ...r, passwordEnc: '' } : r);
      const changedWifi = wifi.filter((x,i) => had(db.wifiNetworks[i])); const changedDevs = devs.filter((x,i) => had(db.netDevices[i]));
      setDb(prev => ({ ...prev, vault: null, wifiNetworks: wifi, netDevices: devs }));
      sbPersist(async c => {
        for(const r of changedWifi) await sbUpsertRow(c, 'wifiNetworks', r);
        for(const r of changedDevs) await sbUpsertRow(c, 'netDevices', r);
        await sbDeleteVault(c);
      });
      lockVault(); notify('Cofre redefinido: as senhas salvas foram apagadas. Crie uma nova senha mestra.', 'success');
    };

    A.clearAll = ()=>{
      const cleared = { ...createEmptyDb(), categories: db.categories, settings: db.settings, vault: db.vault, sites: db.sites, internetLinks: db.internetLinks, wifiNetworks: db.wifiNetworks, netDevices: db.netDevices, demands: db.demands, monthlyTasks: db.monthlyTasks };
      const paths = [...new Set([...db.terms.flatMap(t => [t.filePath, t.signedFilePath]), ...db.attachments.map(a => a.filePath)].filter(Boolean))];
      setDb(cleared);
      sbPersist(async c => {
        if(paths.length){ const r = await c.storage.from('termos').remove(paths); if(r.error) console.warn(r.error); }
        await fullPushDB(c, cleared);
      });
      notify('Base limpa. Categorias e dados da organização foram mantidos.', 'success');
    };
    /* ---- Planejamento em T.I. (demandas em quadro) ---- */
    A.saveDemand = (item)=>{
      const title = (item.title || '').trim();
      if(!title){ notify('Informe o título da demanda.', 'error'); return false; }
      const list = db.demands || []; const old = list.find(x => x.id === item.id);
      const isNew = !old; const now = Date.now(); const lvl = item.level || 'nao_urgente';
      const same = list.filter(x => x.level === lvl && x.id !== item.id);
      const lastPos = same.length ? Math.max(...same.map(x => x.position || 0)) : 0;
      const obj = { ...item, id: item.id || uid('dem'), title, description: (item.description || '').trim(), level: lvl, dueDate: item.dueDate || '',
        position: (isNew || old.level !== lvl) ? lastPos + 1000 : (old.position || 0), createdAt: item.createdAt || now, createdBy: old ? (old.createdBy || '') : (me.name || me.email || ''),
        completedAt: lvl === 'concluido' ? ((old && old.level === 'concluido' && old.completedAt) || now) : null, updatedAt: now, updatedBy: operator.trim() };
      setDb(prev => ({ ...prev, demands: isNew ? [...(prev.demands || []), obj] : prev.demands.map(x => x.id === obj.id ? obj : x) }));
      sbPersist(c => sbUpsertRow(c, 'demands', obj));
      notify(isNew ? 'Demanda criada.' : 'Demanda atualizada.', 'success');
      return obj.id;
    };
    A.moveDemand = (id, level, beforeId)=>{
      const all = db.demands || []; const cur = all.find(x => x.id === id); if(!cur) return false;
      const list = all.filter(x => x.level === level && x.id !== id).sort((a, b) => (a.position || 0) - (b.position || 0));
      const i = beforeId ? list.findIndex(x => x.id === beforeId) : -1;
      const pos = i < 0 ? (list.length ? (list[list.length - 1].position || 0) + 1000 : 1000)
        : (i === 0 ? (list[0].position || 0) - 1000 : ((list[i - 1].position || 0) + (list[i].position || 0)) / 2);
      if(cur.level === level && beforeId === id) return true;
      const obj = { ...cur, level, position: pos, completedAt: level === 'concluido' ? ((cur.level === 'concluido' && cur.completedAt) || Date.now()) : null, updatedAt: Date.now(), updatedBy: operator.trim() };
      setDb(prev => ({ ...prev, demands: prev.demands.map(x => x.id === id ? obj : x) }));
      sbPersist(c => sbUpsertRow(c, 'demands', obj));
      return true;
    };
    A.deleteDemand = (id)=>{
      setDb(prev => ({ ...prev, demands: prev.demands.filter(x => x.id !== id) }));
      sbPersist(c => sbDeleteRow(c, 'demands', id));
      notify('Demanda excluída.', 'success'); return true;
    };
    /* ---- Tarefas mensais (check por mês, zera sozinho quando o mês muda) ---- */
    A.saveMonthly = (item)=>{
      const title = (item.title || '').trim();
      if(!title){ notify('Informe o nome da tarefa mensal.', 'error'); return false; }
      const list = db.monthlyTasks || []; const old = list.find(x => x.id === item.id); const now = Date.now();
      const obj = { ...(old || {}), id: old ? old.id : uid('mon'), title, description: (item.description || '').trim(),
        position: old ? (old.position || 0) : (list.length ? Math.max(...list.map(x => x.position || 0)) + 1000 : 1000),
        checks: old ? (old.checks || '{}') : '{}', createdAt: old ? old.createdAt : now, createdBy: old ? (old.createdBy || '') : (me.name || me.email || ''),
        updatedAt: now, updatedBy: operator.trim() };
      setDb(prev => ({ ...prev, monthlyTasks: old ? prev.monthlyTasks.map(x => x.id === obj.id ? obj : x) : [...(prev.monthlyTasks || []), obj] }));
      sbPersist(c => sbUpsertRow(c, 'monthlyTasks', obj));
      notify(old ? 'Tarefa mensal atualizada.' : 'Tarefa mensal criada.', 'success');
      return obj.id;
    };
    A.deleteMonthly = (id)=>{
      setDb(prev => ({ ...prev, monthlyTasks: prev.monthlyTasks.filter(x => x.id !== id) }));
      sbPersist(c => sbDeleteRow(c, 'monthlyTasks', id));
      notify('Tarefa mensal excluída.', 'success'); return true;
    };
    A.toggleMonthly = (id, ym)=>{
      const t = (db.monthlyTasks || []).find(x => x.id === id); if(!t) return false;
      let ck = {}; try{ ck = JSON.parse(t.checks || '{}') || {}; }catch(_){ ck = {}; }
      if(ck[ym]) delete ck[ym]; else ck[ym] = { at: Date.now(), by: me.name || me.email || '' };
      const obj = { ...t, checks: JSON.stringify(ck), updatedAt: Date.now(), updatedBy: operator.trim() };
      setDb(prev => ({ ...prev, monthlyTasks: prev.monthlyTasks.map(x => x.id === id ? obj : x) }));
      sbPersist(c => sbUpsertRow(c, 'monthlyTasks', obj));
      return true;
    };
    /* permissões: cada ação exige o nível "editar" no módulo dono dela. O banco também confere (RLS); aqui o aviso é imediato. */
    const NEED = {
      saveItem: ()=>['registry'], deleteItem: (kind)=> kind === 'equipments' ? ['equipments'] : ['registry'],
      saveEquipment: ()=>['equipments','movements','terms'], addAttachment: ()=>['terms'], deleteAttachment: ()=>['terms'], addTerm: ()=>['terms'], updateTerm: ()=>['terms'],
      saveSettings: ()=>['registry','terms'], saveInfra: ()=>['infra'], deleteInfra: ()=>['infra'], saveDemand: ()=>['planning'], deleteDemand: ()=>['planning'], moveDemand: ()=>['planning'], saveMonthly: ()=>['planning'], deleteMonthly: ()=>['planning'], toggleMonthly: ()=>['planning'],
      vaultCreate: ()=>['infra'], vaultRekey: ()=>['infra'], vaultReset: ()=>['infra'], clearAll: null };   // clearAll: só administrador
    const NO_PERM = 'Seu usuário não tem permissão para fazer essa alteração.';
    Object.keys(NEED).forEach(name => {
      const orig = A[name]; if(!orig) return;
      A[name] = (...args)=>{
        const mods = NEED[name] ? NEED[name](...args) : null;
        if(mods ? canAnyDo(me, mods, 'edit') : me.role === 'admin') return orig(...args);
        notify(NO_PERM, 'error');
        return /^vault/.test(name) ? NO_PERM : false;
      };
    });
    return A;
  }, [db, notify, sbPersist, operator, lockVault, touchVault, me]);

  const maps = useMemo(()=> buildMaps(db), [db]);
  const askConfirm = (opts)=> setModal({ type:'confirm', ...opts });
  const closeModal = ()=> setModal(null);
  const sync = { status: syncStatus, error: syncError, config: appConfig, connect: connectDb, disconnect: disconnectDb, refresh: refreshFromDb, getClient: ()=> sbClientRef.current };
  const vault = { status: !db.vault ? 'none' : (vaultUnlocked ? 'unlocked' : 'locked'), create: actions.vaultCreate, unlock: actions.vaultUnlock, lock: lockVault, encrypt: actions.vaultEncrypt, decrypt: actions.vaultDecrypt, rekey: actions.vaultRekey, reset: actions.vaultReset };
  window.__isAdmin = me.role === 'admin';
  const ctx = { db, maps, actions, notify, navigate, askConfirm, closeModal, setModal, sync, operator, setOperator, vault, me, isAdmin: me.role === 'admin', can: (mod, min = 'view') => canDo(me, mod, min), signOut: onSignOut };

  return (
    <div className="app-shell">
      <div className={`nav-backdrop ${navOpen ? 'open' : ''}`} onClick={()=>setNavOpen(false)} />
      <Sidebar screen={screen} navigate={navigate} db={db} sync={sync} setModal={(m)=>{ setNavOpen(false); setModal(m); }} me={me} onSignOut={onSignOut} open={navOpen} onClose={()=>setNavOpen(false)} />
      <div style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column' }}>
        <div className="demo-bar" role="note">
          <span className="demo-dot" /> <span><strong>Demonstração</strong><span className="hide-mobile"> · dados fictícios, salvos só neste navegador</span></span>
          <button className="demo-reset" onClick={()=>askConfirm({ title:'Restaurar dados de exemplo', confirmLabel:'Restaurar', tone:'danger', message:'Apagar tudo o que você alterou neste navegador e voltar aos dados fictícios iniciais?', onConfirm: ()=> window.OPHELIA_DEMO.reset() })}>Restaurar dados</button>
        </div>
        <TopBar navigate={navigate} setModal={setModal} sync={sync} me={me} onMenu={()=>setNavOpen(true)} />
        <main className="app-main">
          {syncStatus === 'connecting' && <div style={{ textAlign:'center', padding:'80px 0', color:'var(--text-muted)' }}>Conectando ao banco de dados...</div>}
          {syncStatus === 'connected' && <Router screen={screen} ctx={ctx} />}
          {(syncStatus === 'local' || syncStatus === 'error') && (
            <div className="card fade-up" style={{ maxWidth:560, margin:'60px auto', padding:28, textAlign:'center' }}>
              <Icon path={ICONS.database} size={30} style={{ color:'var(--accent)' }} />
              <h2 style={{ margin:'12px 0 6px', fontSize:20 }}>{syncStatus === 'error' ? 'Não foi possível conectar ao banco' : 'Conecte o banco de dados'}</h2>
              <p style={{ color:'var(--text-muted)', fontSize:13.5, lineHeight:1.6, margin:'0 0 8px' }}>
                {me.role === 'admin' ? 'Os dados são salvos somente no Supabase, nada fica gravado neste navegador. Confira a Project URL e a chave do projeto.' : 'Avise o administrador do sistema: a conexão com o banco não está funcionando.'}
              </p>
              {syncStatus === 'error' && <p style={{ color:'#F0B3B3', fontSize:12.5, lineHeight:1.5, margin:'0 0 8px' }}>{syncError}</p>}
              {me.role === 'admin' && <button className="btn btn-primary" style={{ marginTop:8 }} onClick={()=>setModal({ type:'dbSettings' })}>Abrir configuração do banco</button>}
            </div>
          )}
        </main>
      </div>
      <BottomNav screen={screen} navigate={navigate} me={me} db={db} onMore={()=>setNavOpen(true)} />
      <ToastHost toasts={toasts} />
      {modal && modal.type === 'confirm' && (
        <ConfirmDialog title={modal.title} message={modal.message} tone={modal.tone} confirmLabel={modal.confirmLabel}
          onConfirm={()=>{ modal.onConfirm(); closeModal(); }} onCancel={closeModal} />
      )}
      {modal && modal.type === 'dbSettings' && me.role === 'admin' && <DbSettingsModal sync={sync} notify={notify} onClose={closeModal} />}
      {modal && modal.type === 'equipmentForm' && <EquipmentFormModal ctx={ctx} equipment={modal.equipment} onClose={closeModal} />}
      {modal && modal.type === 'move' && <MoveModal ctx={ctx} equipment={modal.equipment} onClose={closeModal} />}
      {modal && modal.type === 'termViewer' && <TermViewerModal ctx={ctx} term={modal.term} onClose={closeModal} />}
      {modal && modal.type === 'sendAcceptance' && <SendAcceptanceModal ctx={ctx} term={modal.term} initialRes={modal.res} onClose={closeModal} />}
      {modal && modal.type === 'signedDoc' && <SignedDocModal ctx={ctx} term={modal.term} acc={modal.acc} onClose={closeModal} />}
      {modal && modal.type === 'attachSave' && <AttachSaveModal ctx={ctx} term={modal.term} file={modal.file} onClose={closeModal} />}
    </div>
  );
}

function Router({ screen, ctx }){
  if(!allowedScreen(ctx.me, screen.name)) return <NoAccess ctx={ctx} />;
  switch(screen.name){
    case 'equipments': return <EquipmentsScreen ctx={ctx} params={screen.params} />;
    case 'equipment': return <EquipmentDetail ctx={ctx} id={screen.params.id} />;
    case 'movements': return <MovementsScreen ctx={ctx} />;
    case 'terms': return <TermsScreen ctx={ctx} params={screen.params} />;
    case 'planning': return <PlanningScreen ctx={ctx} />;
    case 'infra': return <InfraHome ctx={ctx} />;
    case 'site': return <SiteScreen ctx={ctx} id={screen.params.id} initialTab={screen.params.tab} />;
    case 'registry': return <RegistryScreen ctx={ctx} initialTab={screen.params.tab} />;
    case 'users': return <UsersScreen ctx={ctx} />;
    default: return <Dashboard ctx={ctx} />;
  }
}

function DbSettingsModal({ sync, notify, onClose }){
  const [url, setUrl] = useState(sync.config ? sync.config.url : '');
  const [anonKey, setAnonKey] = useState(sync.config ? sync.config.anonKey : '');
  const [testing, setTesting] = useState(false);
  const [err, setErr] = useState('');

  const connect = async ()=>{
    setErr('');
    if(!url.trim() || !anonKey.trim()){ setErr('Preencha a Project URL e a chave do Supabase.'); return; }
    if(looksLikeSecretKey(anonKey)){ setErr('Essa é a chave SECRETA (service_role). Nunca use aqui: copie a chave pública (anon / publishable).'); return; }
    setTesting(true);
    const cfg = { url: cleanSupabaseUrl(url), anonKey: anonKey.trim() };
    const client = createSbClient(cfg, { persist:false });
    if(!client){ setTesting(false); setErr('Não foi possível iniciar a conexão (a biblioteca do Supabase não carregou ou os dados são inválidos).'); return; }
    try{
      await testSbConnection(client);
      sync.connect(cfg);
      notify('Conectado ao banco de dados.', 'success');
      onClose();
    }catch(e){
      console.error(e);
      setErr('Falha ao conectar: ' + (e && e.message ? e.message : 'verifique a URL, a chave e se o script SQL (supabase/schema.sql) foi executado.'));
    }finally{ setTesting(false); }
  };

  return (
    <Modal title="Banco de dados (Supabase)" onClose={onClose} width={580} footer={
      <React.Fragment>
        {sync.config && <button className="btn btn-danger" onClick={()=>{ sync.disconnect(); notify('Desconectado. Nenhum dado fica guardado neste navegador.', 'info'); onClose(); }}>Desconectar</button>}
        {sync.status === 'connected' && <button className="btn btn-soft" onClick={()=>sync.refresh(false)}><Icon path={ICONS.refresh} size={14}/> Atualizar agora</button>}
        <button className="btn btn-ghost" onClick={onClose}>Fechar</button>
        <button className="btn btn-primary" onClick={connect} disabled={testing}>{testing ? 'Testando...' : 'Conectar'}</button>
      </React.Fragment>
    }>
      <div style={{ display:'flex', gap:8, marginBottom:16, padding:'10px 12px', borderRadius:9, background: sync.status==='connected' ? 'var(--success-soft)' : sync.status==='error' ? 'var(--danger-soft)' : 'var(--surface-2)', fontSize:12.5, lineHeight:1.5 }}>
        {sync.status==='connected' && 'Conectado — tudo é salvo no banco e os PDFs dos termos no Storage; nada fica neste navegador. A tela se atualiza sozinha a cada 15 s.'}
        {sync.status==='error' && (sync.error || 'Falha na conexão.')}
        {sync.status==='local' && 'Nenhum banco conectado — informe a URL e a chave para usar o sistema.'}
        {sync.status==='connecting' && 'Conectando...'}
      </div>
      <p style={{ fontSize:12.5, color:'var(--text-muted)', lineHeight:1.6, margin:'0 0 16px' }}>
        Todos os dados e PDFs ficam no Supabase. Crie um projeto gratuito em <strong>supabase.com</strong>, rode o arquivo <code>supabase/schema.sql</code> no <strong>SQL Editor</strong> e cole abaixo a <strong>Project URL</strong> e a chave <strong>anon / publishable</strong> (Project Settings → API).
      </p>
      <Field label="Project URL"><input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxxxxxx.supabase.co" /></Field>
      <Field label="Chave anon / publishable" hint="Nunca use a chave service_role/secret aqui.">
        <input value={anonKey} onChange={e=>setAnonKey(e.target.value)} placeholder="eyJhbGciOi... ou sb_publishable_..." />
      </Field>
      {err && <div style={{ marginTop:12, fontSize:12.5, color:'#F0B3B3', lineHeight:1.5 }}>{err}</div>}
    </Modal>
  );
}

   ============================================================ */
const sortedLocs = db => [...db.locations].sort((a,b)=> a.name.localeCompare(b.name, 'pt-BR', { numeric:true }));
const secLocName = (db, x) => { const l = x.locationId ? db.locations.find(y => y.id === x.locationId) : null; return l ? l.name : ''; };
const sortedSecs = db => [...(db.sectors || [])].sort((a,b)=> secLocName(db,a).localeCompare(secLocName(db,b), 'pt-BR', { numeric:true }) || a.name.localeCompare(b.name, 'pt-BR', { numeric:true }));
/* setores que podem ser escolhidos para um local (os antigos, ainda sem local definido, aparecem em qualquer um) */
const sectorsFor = (db, locationId) => sortedSecs(db).filter(x => !x.locationId || (locationId && x.locationId === locationId));
function ChartCard({ title, subtitle, action, children, style }){
  return (
    <div className="card chart-card" style={style}>
      <div className="chart-head">
        <div style={{ minWidth:0 }}>
          <h3>{title}</h3>
          {subtitle && <div className="sub">{subtitle}</div>}
        </div>
        {action}
      </div>
      <div style={{ flex:1, minWidth:0 }}>{children}</div>
    </div>
  );
}
function StatCard({ label, value, tone, icon, total }){
  const color = { indigo:'var(--indigo)', teal:'var(--teal)', accent:'var(--accent)', warn:'var(--warn)', success:'var(--success)', danger:'var(--danger)' }[tone] || 'var(--text)';
  const pct = total ? Math.round(value / total * 100) : null;
  return (
    <div className="card kpi" style={{ '--tone':color }}>
      <div className="kpi-top">
        <span className="kpi-label" title={label}>{label}</span>
        {icon && <span className="kpi-icon"><Icon path={icon} size={15}/></span>}
      </div>
      <div className="kpi-value font-display">{value}</div>
      {pct !== null
        ? <div><div className="kpi-bar"><span style={{ width: pct + '%' }} /></div><div className="kpi-foot" style={{ marginTop:6 }}>{pct}% do total</div></div>
        : <div className="kpi-foot">nos filtros atuais</div>}
    </div>
  );
}
/* legenda em lista: cor, nome, quantidade e percentual */
function LegendList({ items, total }){
  return (
    <div className="legend-list">
      {items.map(it => (
        <div key={it.label} className="legend-row">
          <span className="sw" style={{ background:it.color }} />
          <span style={{ minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{it.label}</span>
          <span className="n">{it.n}</span>
          <span className="p">{total ? Math.round(it.n / total * 100) : 0}%</span>
        </div>
      ))}
    </div>
  );
}

/* Itens por local: escolha um local e veja o que há nele e com quem está cada item. */
function LocationItemsCard({ ctx }){
  const { db, maps, navigate, notify } = ctx;
  const [loc, setLoc] = useState('');        // '' = todos | '__none' = sem local | id
  const [own, setOwn] = useState('');        // '' = todos | 'com' | 'sem'
  const [hideOff, setHideOff] = useState(true);
  const [q, setQ] = useState('');
  const locs = sortedLocs(db);
  const nq = norm(q.trim());
  const rows = useMemo(()=> db.equipments.map(eq => ({ eq, ...eqInfo(eq, maps) })).filter(r => {
    if(hideOff && r.eq.status === 'Baixado') return false;
    if(loc === '__none' ? r.location : (loc && r.eq.locationId !== loc)) return false;
    if(own === 'com' && !r.responsible) return false;
    if(own === 'sem' && r.responsible) return false;
    if(nq && !norm([r.eq.patrimony, r.eq.serial, prodLabel(r.product), r.category && r.category.name, r.responsible && r.responsible.name].join(' ')).includes(nq)) return false;
    return true;
  }).sort((a,b)=> a.eq.patrimony.localeCompare(b.eq.patrimony, 'pt-BR', { numeric:true })), [db, maps, loc, own, hideOff, nq]);

  const groups = [...locs.map(l => ({ key:l.id, name:l.name, rows: rows.filter(r => r.location && r.location.id === l.id) })),
    { key:'__none', name:'Sem local', rows: rows.filter(r => !r.location) }].filter(g => g.rows.length);
  const com = rows.filter(r => r.responsible).length;

  const exportCsv = ()=>{ if(!ctx.isAdmin) return;
    const head = ['Local','Patrimônio','Categoria','Produto','Nº de série','Status','Responsável','Setor do responsável'];
    const lines = [head.join(';')].concat(rows.map(r => [r.location ? r.location.name : 'Sem local', r.eq.patrimony, r.category ? r.category.name : '', prodLabel(r.product), r.eq.serial, r.eq.status, r.responsible ? r.responsible.name : '', r.responsible ? r.responsible.department : ''].map(csvEscape).join(';')));
    downloadBlob(new Blob(['\ufeff' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }), 'itens_por_local.csv');
    notify(`${rows.length} item(ns) exportado(s).`, 'success');
  };

  return (
    <div className="card" style={{ padding:18, marginBottom:16 }}>
      <div className="chart-head">
        <div>
          <h3 style={{ margin:0, fontSize:15, fontWeight:700 }}>Itens por local</h3>
          <div style={{ fontSize:12, color:'var(--text-faint)', marginTop:3 }}>O que há em cada local e com quem está cada item. Esta lista tem filtros próprios.</div>
        </div>
        {ctx.isAdmin && <button className="btn btn-soft btn-sm" onClick={exportCsv} disabled={!rows.length}><Icon path={ICONS.download} size={14}/> Exportar CSV</button>}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))', gap:10, alignItems:'center', marginBottom:12 }}>
        <input type="search" placeholder="Buscar patrimônio, produto ou responsável..." value={q} onChange={e=>setQ(e.target.value)} />
        <MobileFilters count={[loc, own].filter(Boolean).length + (hideOff ? 0 : 1)}>
        <select value={loc} onChange={e=>setLoc(e.target.value)} aria-label="Local">
          <option value="">Todos os locais</option>{locs.map(l => <option key={l.id} value={l.id}>{l.name}</option>)}<option value="__none">Sem local</option>
        </select>
        <select value={own} onChange={e=>setOwn(e.target.value)} aria-label="Posse">
          <option value="">Com e sem responsável</option><option value="com">Em posse de alguém</option><option value="sem">Sem responsável</option>
        </select>
        <label style={{ display:'flex', gap:8, alignItems:'center', fontSize:13, color:'var(--text-muted)', cursor:'pointer' }}><input type="checkbox" checked={hideOff} onChange={e=>setHideOff(e.target.checked)} /> Ocultar baixados</label>
        </MobileFilters>
      </div>
      <div style={{ display:'flex', gap:8, marginBottom:12, flexWrap:'wrap' }}>
        <StatusBadge tone="accent">{rows.length} item(ns)</StatusBadge>
        <StatusBadge tone="success">{com} com responsável</StatusBadge>
        <StatusBadge tone="muted">{rows.length - com} sem responsável</StatusBadge>
      </div>
      <div style={{ maxHeight:440, overflowY:'auto' }}>
        {groups.length === 0 && <EmptyState small text={db.equipments.length ? 'Nenhum item com esses filtros.' : 'Nenhum equipamento cadastrado.'} />}
        {groups.map(g => (
          <div key={g.key} style={{ marginBottom:14 }}>
            <div style={{ display:'flex', alignItems:'center', gap:8, fontSize:13, fontWeight:700, margin:'0 0 8px', color:'var(--text)' }}><Icon path={ICONS.building} size={14} style={{ color:'var(--accent)' }}/>{g.name} <span style={{ color:'var(--text-faint)', fontWeight:500 }}>· {g.rows.length} item(ns)</span></div>
            <div style={{ overflowX:'auto', border:'1px solid var(--border)', borderRadius:12, background:'#0000001f' }}>
              <table>
                <thead><tr><th>Patrimônio</th><th>Categoria</th><th>Produto</th><th>Nº de série</th><th>Status</th><th>Responsável</th></tr></thead>
                <tbody>
                  {g.rows.map(r => (
                    <tr key={r.eq.id}>
                      <td><span style={{ fontWeight:700, cursor:'pointer' }} onClick={()=>navigate('equipment', { id:r.eq.id })}>{r.eq.patrimony}</span></td>
                      <td style={{ color:'var(--text-muted)' }}>{r.category ? r.category.name : '—'}</td>
                      <td>{prodLabel(r.product)}</td>
                      <td style={{ color:'var(--text-muted)' }}>{r.eq.serial || '—'}</td>
                      <td><EqStatus status={r.eq.status} /></td>
                      <td>{r.responsible ? <span style={{ fontWeight:600 }}>{r.responsible.name}{r.responsible.department ? <span style={{ color:'var(--text-faint)', fontWeight:400 }}> · {r.responsible.department}</span> : null}</span> : <span style={{ color:'var(--text-faint)' }}>Sem responsável</span>}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

async function printEquipmentLabels(ctx, list){
  if(!window.jspdf){ ctx.notify('A biblioteca de PDF não carregou. Verifique sua conexão com a internet.', 'error'); return; }
  if(!list.length){ ctx.notify('Nenhum equipamento para gerar etiquetas.', 'error'); return; }
  try{
    const items = list.map(eq => { const i = eqInfo(eq, ctx.maps); return { patrimony: eq.patrimony, serial: eq.serial, product: [i.category ? i.category.name : '', prodLabel(i.product)].filter(Boolean).join(' - ') }; });
    const doc = await buildLabelsPdf(items, ctx.db.settings.orgName);
    doc.save(list.length === 1 ? `etiqueta_${list[0].patrimony}.pdf` : `etiquetas_${list.length}.pdf`);
    ctx.notify(list.length === 1 ? 'Etiqueta gerada.' : `${list.length} etiquetas geradas (A4, 3 colunas).`, 'success');
  }catch(e){ console.error(e); ctx.notify('Falha ao gerar etiquetas: ' + (e.message || e), 'error'); }
}

function EquipmentsScreen({ ctx, params }){
  const { db, maps, actions, navigate, setModal, askConfirm, notify } = ctx;
  const [q, setQ] = useState(params.q || '');
  const [fCat, setFCat] = useState(''); const [fLoc, setFLoc] = useState(''); const [fStatus, setFStatus] = useState(''); const [fResp, setFResp] = useState(''); const [fProd, setFProd] = useState(''); const [fSec, setFSec] = useState('');
  const [sort, setSort] = useState({ k:'patrimony', dir:1 });
  const [limit, setLimit] = useState(100);
  const [sel, setSel] = useState(()=> new Set());
  useEffect(()=>{ setQ(params.q || ''); }, [params.q, params.stamp]);

  const rows = useMemo(()=>{
    const nq = norm(q.trim());
    return db.equipments.map(eq => ({ eq, ...eqInfo(eq, maps) })).filter(r => {
      if(fCat && !(r.category && r.category.id === fCat)) return false;
      if(fLoc && (fLoc === '__none' ? r.location : r.eq.locationId !== fLoc)) return false;
      if(fSec && (fSec === '__none' ? r.sector : r.eq.sectorId !== fSec)) return false;
      if(fStatus && r.eq.status !== fStatus) return false;
      if(fProd && r.eq.productId !== fProd) return false;
      if(fResp && (fResp === '__none' ? r.responsible : r.eq.responsibleId !== fResp)) return false;
      if(nq){
        const hay = norm([r.eq.patrimony, r.eq.serial, prodLabel(r.product), r.category && r.category.name, r.location && r.location.name, r.sector && r.sector.name, r.responsible && r.responsible.name, r.eq.notes].join(' '));
        if(!nq.split(/\s+/).every(w => hay.includes(w))) return false;   // cada palavra, em qualquer ordem
      }
      return true;
    }).sort((a,b)=>{
      const key = (r)=> sort.k === 'category' ? (r.category ? r.category.name : '') : sort.k === 'product' ? prodLabel(r.product) : sort.k === 'serial' ? (r.eq.serial || '')
        : sort.k === 'status' ? (r.eq.status || '') : sort.k === 'location' ? (r.location ? r.location.name : '') : sort.k === 'sector' ? (r.sector ? r.sector.name : '') : sort.k === 'responsible' ? (r.responsible ? r.responsible.name : '') : r.eq.patrimony;
      const A = key(a), B = key(b);
      if(!A !== !B) return A ? -1 : 1;                                   // campos vazios ficam sempre no fim
      const c = A.localeCompare(B, 'pt-BR', { numeric:true }) * sort.dir;
      return c || a.eq.patrimony.localeCompare(b.eq.patrimony, 'pt-BR', { numeric:true });
    });
  }, [db, maps, q, fCat, fLoc, fSec, fStatus, fResp, fProd, sort]);
  const hasFilter = !!(q.trim() || fCat || fLoc || fSec || fStatus || fResp || fProd);
  const clearFilters = ()=>{ setQ(''); setFCat(''); setFLoc(''); setFSec(''); setFStatus(''); setFResp(''); setFProd(''); };
  const sortTh = (k, label) => <th onClick={()=>setSort(sv => sv.k === k ? { k, dir: -sv.dir } : { k, dir:1 })} style={{ cursor:'pointer', userSelect:'none' }} title="Clique para ordenar">{label}{sort.k === k ? (sort.dir === 1 ? ' ▲' : ' ▼') : ''}</th>;

  const toggle = id => setSel(prev => { const n = new Set(prev); n.has(id) ? n.delete(id) : n.add(id); return n; });
  const allVisibleSelected = rows.length > 0 && rows.slice(0, limit).every(r => sel.has(r.eq.id));
  const toggleAll = ()=> setSel(prev => { const n = new Set(prev); rows.slice(0, limit).forEach(r => allVisibleSelected ? n.delete(r.eq.id) : n.add(r.eq.id)); return n; });
  const selectedList = rows.filter(r => sel.has(r.eq.id)).map(r => r.eq);

  const exportCsv = ()=>{ if(!ctx.isAdmin) return;
    const head = ['Patrimônio','Categoria','Produto','Número de série','Status','Local','Setor','Responsável','Data de aquisição','Observações'];
    const lines = [head.join(';')].concat(rows.map(r => [r.eq.patrimony, r.category ? r.category.name : '', prodLabel(r.product), r.eq.serial, r.eq.status, r.location ? r.location.name : '', r.sector ? r.sector.name : '', r.responsible ? r.responsible.name : '', r.eq.acquiredAt ? fmtDate(r.eq.acquiredAt) : '', r.eq.notes].map(csvEscape).join(';')));
    downloadBlob(new Blob(['\ufeff' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }), 'equipamentos.csv');
    notify(`${rows.length} equipamento(s) exportado(s).`, 'success');
  };
  const confirmDelete = eq => askConfirm({ title:'Excluir equipamento', tone:'danger', confirmLabel:'Excluir',
    message:`Excluir o equipamento ${eq.patrimony}? O histórico de movimentações dele também será apagado. Os termos já emitidos são mantidos.`,
    onConfirm: ()=> actions.deleteItem('equipments', eq.id) });

  return (
    <div className="fade-up">
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', flexWrap:'wrap', gap:10, marginBottom:16 }}>
        <div>
          <h1 style={{ fontSize:24, margin:'0 0 4px', fontWeight:600 }}>Equipamentos</h1>
          <div style={{ color:'var(--text-muted)', fontSize:13 }}>{rows.length} de {db.equipments.length} equipamento(s)</div>
        </div>
        <div className="head-actions" style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          {ctx.isAdmin && <button className="btn btn-soft btn-sm" onClick={exportCsv}><Icon path={ICONS.download} size={14}/> Exportar CSV</button>}
          <button className="btn btn-soft btn-sm" onClick={()=>printEquipmentLabels(ctx, selectedList.length ? selectedList : rows.map(r=>r.eq))}><Icon path={ICONS.tag} size={14}/> Etiquetas ({selectedList.length ? 'selecionados' : 'filtrados'})</button>
          {ctx.can('equipments','edit') && <button className="btn btn-primary btn-sm hide-mobile" onClick={()=>setModal({ type:'equipmentForm', equipment:null })}><Icon path={ICONS.plus} size={14}/> Novo equipamento</button>}
        </div>
      </div>

      <div className="card" style={{ padding:12, marginBottom:14, display:'flex', flexWrap:'wrap', gap:10, alignItems:'center' }}>
        <div style={{ position:'relative', flex:'2 1 260px' }}>
          <Icon path={ICONS.search} size={14} style={{ position:'absolute', left:10, top:10, color:'var(--text-faint)' }}/>
          <input type="search" placeholder="Patrimônio, série, produto, responsável..." value={q} onChange={e=>setQ(e.target.value)} style={{ paddingLeft:30 }} />
        </div>
        <MobileFilters count={[fCat, fLoc, fSec, fStatus, fResp, fProd].filter(Boolean).length}>
        <select value={fCat} onChange={e=>setFCat(e.target.value)} style={{ flex:'1 1 150px', width:'auto', minWidth:0 }}><option value="">Todas as categorias</option>{db.categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}</select>
        <select value={fProd} onChange={e=>setFProd(e.target.value)} style={{ flex:'1 1 150px', width:'auto', minWidth:0 }}><option value="">Todos os produtos</option>{[...db.products].sort((x,y)=>prodLabel(x).localeCompare(prodLabel(y),'pt-BR')).map(p => <option key={p.id} value={p.id}>{prodLabel(p)}</option>)}</select>
        <select value={fLoc} onChange={e=>setFLoc(e.target.value)} style={{ flex:'1 1 150px', width:'auto', minWidth:0 }}><option value="">Todos os locais</option>{sortedLocs(db).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}<option value="__none">Sem local</option></select>
        <select value={fSec} onChange={e=>setFSec(e.target.value)} style={{ flex:'1 1 150px', width:'auto', minWidth:0 }}><option value="">Todos os setores</option>{sortedSecs(db).map(x => <option key={x.id} value={x.id}>{x.name + (secLocName(db, x) ? ' · ' + secLocName(db, x) : '')}</option>)}<option value="__none">Sem setor</option></select>
        <select value={fStatus} onChange={e=>setFStatus(e.target.value)} style={{ flex:'1 1 150px', width:'auto', minWidth:0 }}><option value="">Todos os status</option>{STATUSES.map(s => <option key={s} value={s}>{s}</option>)}</select>
        <select value={fResp} onChange={e=>setFResp(e.target.value)} style={{ flex:'1 1 150px', width:'auto', minWidth:0 }}><option value="">Todos os responsáveis</option>{[...db.responsibles].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(r => <option key={r.id} value={r.id}>{r.name}</option>)}<option value="__none">Sem responsável</option></select>
        {hasFilter && <button className="btn btn-ghost btn-sm" onClick={clearFilters}><Icon path={ICONS.x} size={13}/> Limpar filtros</button>}
        </MobileFilters>
      </div>

      <div className="card" style={{ overflowX:'auto' }}>
        <table>
          <thead><tr>
            <th style={{ width:30 }}><input type="checkbox" style={{ width:'auto' }} checked={allVisibleSelected} onChange={toggleAll} aria-label="Selecionar todos" /></th>
            {sortTh('patrimony','Patrimônio')}{sortTh('category','Categoria')}{sortTh('product','Produto')}{sortTh('serial','Nº de série')}{sortTh('status','Status')}{sortTh('location','Local')}{sortTh('sector','Setor')}{sortTh('responsible','Responsável')}<th></th>
          </tr></thead>
          <tbody>
            {rows.slice(0, limit).map(r => (
              <tr key={r.eq.id}>
                <td><input type="checkbox" style={{ width:'auto' }} checked={sel.has(r.eq.id)} onChange={()=>toggle(r.eq.id)} aria-label={`Selecionar ${r.eq.patrimony}`} /></td>
                <td><span style={{ fontWeight:700, cursor:'pointer' }} onClick={()=>navigate('equipment', { id:r.eq.id })}>{r.eq.patrimony}</span></td>
                <td style={{ color:'var(--text-muted)' }}>{r.category ? r.category.name : '—'}</td>
                <td>{prodLabel(r.product)}{r.eq.notes && r.eq.notes.trim() && <div title={r.eq.notes} style={{ marginTop:5, fontSize:12, lineHeight:1.45, color:'#EBCB94', background:'var(--warn-soft)', borderLeft:'3px solid var(--warn)', borderRadius:5, padding:'3px 8px', maxWidth:360, display:'-webkit-box', WebkitLineClamp:2, WebkitBoxOrient:'vertical', overflow:'hidden', whiteSpace:'pre-wrap', overflowWrap:'anywhere' }}><strong>Obs.:</strong> {r.eq.notes}</div>}</td>
                <td style={{ color:'var(--text-muted)' }}>{r.eq.serial || '—'}</td>
                <td><EqStatus status={r.eq.status} /></td>
                <td>{r.location ? r.location.name : <span style={{ color:'var(--text-faint)' }}>—</span>}</td>
                <td>{r.sector ? r.sector.name : <span style={{ color:'var(--text-faint)' }}>—</span>}</td>
                <td>{r.responsible ? r.responsible.name : <span style={{ color:'var(--text-faint)' }}>—</span>}</td>
                <td>
                  <div style={{ display:'flex', gap:4, justifyContent:'flex-end' }}>
                    {(ctx.can('equipments','edit') || ctx.can('movements','edit')) && <button className="btn btn-ghost btn-sm" title="Movimentar" onClick={()=>setModal({ type:'move', equipment:r.eq })}><Icon path={ICONS.swap} size={13}/></button>}
                    <button className="btn btn-ghost btn-sm" title="Gerar termo" onClick={()=>navigate('terms', { equipmentId:r.eq.id })}><Icon path={ICONS.file} size={13}/></button>
                    <button className="btn btn-ghost btn-sm" title="Etiqueta" onClick={()=>printEquipmentLabels(ctx, [r.eq])}><Icon path={ICONS.tag} size={13}/></button>
                    {ctx.can('equipments','edit') && <button className="btn btn-ghost btn-sm" title="Editar" onClick={()=>setModal({ type:'equipmentForm', equipment:r.eq })}><Icon path={ICONS.edit} size={13}/></button>}
                    {ctx.can('equipments','edit') && <button className="btn btn-ghost btn-sm" title="Excluir" onClick={()=>confirmDelete(r.eq)}><Icon path={ICONS.trash} size={13}/></button>}
                  </div>
                </td>
              </tr>
            ))}
            {rows.length === 0 && <tr><td colSpan={10}><EmptyState text={db.equipments.length ? 'Nenhum equipamento encontrado com esses filtros.' : 'Nenhum equipamento cadastrado. Clique em "Novo equipamento".'} /></td></tr>}
          </tbody>
        </table>
      </div>
      {rows.length > limit && <div style={{ textAlign:'center', marginTop:12 }}><button className="btn btn-soft" onClick={()=>setLimit(l => l + 100)}>Mostrar mais ({rows.length - limit} restantes)</button></div>}
    </div>
  );
}

function EquipmentFormModal({ ctx, equipment, onClose }){
  const { db, actions, navigate } = ctx;
  const [f, setF] = useState(equipment ? { ...equipment, serial: equipment.serial||'', notes: equipment.notes||'', acquiredAt: equipment.acquiredAt||'' } : { productId:'', patrimony:'', serial:'', status:'Em estoque', locationId:'', sectorId:'', responsibleId:'', acquiredAt:'', notes:'' });
  const [note, setNote] = useState('');
  const set = (k, v) => setF(prev => ({ ...prev, [k]: v }));
  const setLoc = v => setF(prev => { const sec = prev.sectorId ? (db.sectors || []).find(x => x.id === prev.sectorId) : null; return { ...prev, locationId: v, sectorId: (sec && sec.locationId && sec.locationId !== v) ? '' : prev.sectorId }; });   // trocou de local: o setor antigo não vale mais
  const products = [...db.products].map(p => ({ p, c: db.categories.find(c => c.id === p.categoryId) })).sort((a,b)=> (a.c ? a.c.name : '').localeCompare(b.c ? b.c.name : '', 'pt-BR') || prodLabel(a.p).localeCompare(prodLabel(b.p), 'pt-BR'));
  const submit = ()=>{ const id = actions.saveEquipment(f, note); if(id) onClose(); };

  if(!db.products.length){
    return (
      <Modal title="Novo equipamento" onClose={onClose} width={440} footer={<React.Fragment><button className="btn btn-ghost" onClick={onClose}>Fechar</button><button className="btn btn-primary" onClick={()=>{ onClose(); navigate('registry', { tab:'products' }); }}>Cadastrar produto</button></React.Fragment>}>
        <p style={{ margin:0, color:'var(--text-muted)', fontSize:13.5, lineHeight:1.6 }}>Antes de cadastrar um equipamento, cadastre ao menos um <strong>produto</strong> (por exemplo, "Dell Latitude 5420" na categoria Notebook).</p>
      </Modal>
    );
  }
  return (
    <Modal title={equipment ? `Editar equipamento ${equipment.patrimony}` : 'Novo equipamento'} onClose={onClose} width={620} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={submit}>{equipment ? 'Salvar' : 'Cadastrar'}</button></React.Fragment>
    }>
      <Field label="Produto"><select value={f.productId} onChange={e=>set('productId', e.target.value)}>
        <option value="">Selecione...</option>
        {products.map(({p,c}) => <option key={p.id} value={p.id}>{(c ? c.name : '?')} · {prodLabel(p)}</option>)}
      </select></Field>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
        <Field label="Nº de patrimônio"><input value={f.patrimony} onChange={e=>set('patrimony', e.target.value)} placeholder="Ex.: PAT-000123" autoFocus /></Field>
        <Field label="Nº de série"><input value={f.serial} onChange={e=>set('serial', e.target.value)} placeholder="Opcional" /></Field>
        <Field label="Status"><select value={f.status} onChange={e=>set('status', e.target.value)}>{STATUSES.map(s => <option key={s} value={s}>{s}</option>)}</select></Field>
        <Field label="Data de aquisição"><input type="date" value={f.acquiredAt || ''} onChange={e=>set('acquiredAt', e.target.value)} /></Field>
        <Field label="Local"><select value={f.locationId || ''} onChange={e=>setLoc(e.target.value)}><option value="">Sem local</option>{sortedLocs(db).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select></Field>
        <Field label="Setor"><select value={f.sectorId || ''} onChange={e=>set('sectorId', e.target.value)} disabled={!f.locationId}><option value="">{f.locationId ? 'Sem setor' : 'Escolha o local primeiro'}</option>{sectorsFor(db, f.locationId).map(x => <option key={x.id} value={x.id}>{x.name + (x.locationId ? '' : ' (sem local definido)')}</option>)}</select></Field>
        <div style={{ gridColumn:'1 / -1' }}><Field label="Responsável"><select value={f.responsibleId || ''} onChange={e=>set('responsibleId', e.target.value)}><option value="">Sem responsável</option>{[...db.responsibles].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(r => <option key={r.id} value={r.id}>{r.name}</option>)}</select></Field></div>
      </div>
      <Field label="Observações" hint="Aparecem em destaque na lista e na página do equipamento."><textarea rows={4} value={f.notes} onChange={e=>set('notes', e.target.value)} placeholder="Ex.: acompanha carregador e mouse; tela com risco no canto" /></Field>
      {equipment && <Field label="Observação da movimentação (opcional)" hint="Aparece no histórico se local, setor, responsável ou status mudarem."><input value={note} onChange={e=>setNote(e.target.value)} /></Field>}
    </Modal>
  );
}

function MoveModal({ ctx, equipment, onClose }){
  const { db, maps, actions, notify } = ctx;
  const [status, setStatus] = useState(equipment.status);
  const [locationId, setLocationId] = useState(equipment.locationId || '');
  const [sectorId, setSectorId] = useState(equipment.sectorId || '');
  const [notes, setNotes] = useState(equipment.notes || '');
  const [responsibleId, setResponsibleId] = useState(equipment.responsibleId || '');
  const [note, setNote] = useState('');
  const pickLoc = v => { setLocationId(v); const sec = sectorId ? (db.sectors || []).find(x => x.id === sectorId) : null; if(sec && sec.locationId && sec.locationId !== v) setSectorId(''); };   // trocou de local: o setor antigo não vale mais
  const submit = ()=>{
    const neu = { ...equipment, status, locationId: locationId || null, sectorId: sectorId || null, responsibleId: responsibleId || null, notes };
    const notesChanged = (notes || '') !== (equipment.notes || '');
    if(!detectMovementType(equipment, neu) && !notesChanged){ notify('Nenhuma alteração: mude o local, o setor, o responsável, o status ou as observações do equipamento.', 'error'); return; }
    if(actions.saveEquipment(neu, note)) onClose();
  };
  return (
    <Modal title={`Movimentar / editar ${eqLabel(equipment, maps)}`} onClose={onClose} width={520} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={submit}>Salvar</button></React.Fragment>
    }>
      <Field label="Local"><select value={locationId} onChange={e=>pickLoc(e.target.value)}><option value="">Sem local</option>{sortedLocs(db).map(l => <option key={l.id} value={l.id}>{l.name}</option>)}</select></Field>
      <Field label="Setor"><select value={sectorId} onChange={e=>setSectorId(e.target.value)} disabled={!locationId}><option value="">{locationId ? 'Sem setor' : 'Escolha o local primeiro'}</option>{sectorsFor(db, locationId).map(x => <option key={x.id} value={x.id}>{x.name + (x.locationId ? '' : ' (sem local definido)')}</option>)}</select></Field>
      <Field label="Responsável"><select value={responsibleId} onChange={e=>setResponsibleId(e.target.value)}><option value="">Sem responsável</option>{[...db.responsibles].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR')).map(r => <option key={r.id} value={r.id}>{r.name}</option>)}</select></Field>
      <Field label="Status"><select value={status} onChange={e=>setStatus(e.target.value)}>{STATUSES.map(s => <option key={s} value={s}>{s}</option>)}</select></Field>

async function downloadUrl(ctx, url, filename){
  if(!url){ ctx.notify('Arquivo indisponível.', 'error'); return; }
  try{
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    downloadBlob(await res.blob(), filename);
  }catch(e){ console.error(e); window.open(url, '_blank'); }
}
const downloadTerm = (ctx, t) => downloadUrl(ctx, t.fileUrl, `${t.number}.pdf`);

const SIGNED_EXTS = ['pdf','png','jpg','jpeg','webp'];
const MAX_SIGNED_MB = 10;
const termKindLabel = t => t.kind === 'devolucao' ? 'Devolução' : 'Entrega';

const fmtSize = n => !n ? '' : n < 1048576 ? `${Math.max(1, Math.round(n/1024))} KB` : `${(n/1048576).toFixed(1).replace('.',',')} MB`;
const isImageName = name => /\.(png|jpe?g|webp)$/i.test(name || '');

/* 1) valida o arquivo escolhido e abre a tela de conferência (ainda NÃO envia nada). */
function stageAttachment(ctx, term, file){
  if(!file) return;
  if(!ctx.sync.getClient()){ ctx.notify('Sem conexão com o banco. Conecte para anexar o arquivo.', 'error'); return; }
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if(!SIGNED_EXTS.includes(ext)){ ctx.notify('Formato não aceito. Envie PDF, JPG ou PNG.', 'error'); return; }
  if(file.size > MAX_SIGNED_MB * 1024 * 1024){ ctx.notify(`Arquivo maior que ${MAX_SIGNED_MB} MB.`, 'error'); return; }
  ctx.setModal({ type:'attachSave', term, file });
}
/* 2) ao clicar em "Salvar anexo": envia para o Storage (cópia de segurança) e registra. Nunca apaga versões anteriores. */
async function saveAttachment(ctx, term, file){
  const client = ctx.sync.getClient();
  if(!client){ ctx.notify('Sem conexão com o banco.', 'error'); return false; }
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  const year = (term.filePath || '').split('/')[0] || String(new Date().getFullYear());
  const path = `${year}/${term.number}-assinado-${Date.now().toString(36)}.${ext}`;
  const up = await client.storage.from('termos').upload(path, file, { contentType: file.type || undefined, upsert:true });
  if(up.error){ ctx.notify('Não foi possível salvar o arquivo: ' + up.error.message, 'error'); return false; }
  const att = { id: uid('att'), termId: term.id, filePath: path, fileUrl: client.storage.from('termos').getPublicUrl(path).data.publicUrl, fileName: file.name, size: file.size, createdAt: Date.now() };
  if(!ctx.actions.addAttachment(att)) return false;
  ctx.notify(`Arquivo assinado salvo no termo ${term.number} (cópia de segurança no Storage).`, 'success');
  return true;
}
/* Anexo antigo (versão anterior do sistema, sem registro na tabela de anexos). */
async function removeLegacySigned(ctx, term){
  const client = ctx.sync.getClient();
  if(client && term.signedFilePath){ try{ await client.storage.from('termos').remove([term.signedFilePath]); }catch(e){ console.warn(e); } }
  ctx.actions.updateTerm({ ...term, signedFilePath:'', signedFileUrl:'', signedFileName:'', signedAt:null });
  ctx.notify('Anexo removido.', 'success');
}

/* ============================================================
   ACEITE DIGITAL DE TERMOS (por e-mail)
   O painel cria a solicitação; o e-mail, o link e o registro do aceite são feitos
   pela Edge Function "term-acceptance" (supabase/functions/term-acceptance).
   ============================================================ */
const sha256Hex = async (buf) => Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', buf))).map(b => b.toString(16).padStart(2, '0')).join('');
const accsOf = (db, termId) => (db.acceptances || []).filter(a => a.termId === termId).sort((a,b) => b.createdAt - a.createdAt);
const effStatus = a => (a.status === 'pendente' && a.expiresAt && Date.now() > a.expiresAt) ? 'expirado' : a.status;
/* o que vale para o termo: o aceite (se houver) ou a solicitação mais recente que não foi cancelada */
const latestAcceptance = (db, termId) => { const l = accsOf(db, termId); return l.find(a => a.status === 'aceito') || l.find(a => a.status !== 'cancelado') || null; };
const isAccepted = (db, termId) => accsOf(db, termId).some(a => a.status === 'aceito');
const fmtBR = ms => new Intl.DateTimeFormat('pt-BR', { timeZone:'America/Sao_Paulo', dateStyle:'short', timeStyle:'medium' }).format(new Date(Number(ms)));
function accInfo(a){
  if(a.status === 'aceito') return { tone:'success', text:'Aceito digitalmente' };
  const st = effStatus(a);
  if(st === 'expirado') return { tone:'danger', text:'Aceite expirado' };
  if(!a.sentAt) return { tone:'muted', text:'Link não gerado' };
  return { tone:'warn', text:'Aguardando aceite' };
}
const AcceptanceBadge = ({ acc }) => { const i = accInfo(acc); return <StatusBadge tone={i.tone}>{i.text}</StatusBadge>; };

const ACC_ERRORS = {
  function_missing: 'A função de aceite ainda não foi publicada no Supabase. Siga o passo a passo "Aceite digital" do README (supabase functions deploy term-acceptance --no-verify-jwt).',
  network: 'Não foi possível contatar a função de aceite. Confira a conexão e se ela foi publicada (README: "Aceite digital").',
};
async function callAcceptanceFn(ctx, body){
  const cfg = ctx.sync.config; if(!cfg) return { ok:false, error:'network', message:'Sem conexão com o banco.' };
  let res;
  try{ res = await fetch(`${cleanSupabaseUrl(cfg.url)}/functions/v1/term-acceptance`, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(body) }); }
  catch(e){ return { ok:false, error:'network', message: ACC_ERRORS.network }; }
  let j = {}; try{ j = await res.json(); }catch(e){}
  if(res.status === 404 && !j.error) return { ok:false, error:'function_missing', message: ACC_ERRORS.function_missing };
  if(!res.ok || j.ok === false) return { ok:false, error: j.error || ('http_' + res.status), message: j.message || ('Erro ' + res.status), detail: j.detail };
  return { ok:true, ...j };
}

/* cria a solicitação no banco e pede à função para gerar o link individual (modo manual) */
async function requestAcceptance(ctx, term, o){
  const client = ctx.sync.getClient();
  if(!client) return { ok:false, message:'Sem conexão com o banco.' };
  if(!/^https?:$/.test(location.protocol)) return { ok:false, message:'Abra o sistema pelo endereço da hospedagem (https://...) para gerar o link de aceite. Abrindo o arquivo direto do computador, o link não funcionaria para o destinatário.' };
  if(isAccepted(ctx.db, term.id)) return { ok:false, message:'Este termo já foi aceito digitalmente.' };
  let buf;
  try{ buf = o.blob ? await o.blob.arrayBuffer() : await (await fetch(term.fileUrl)).arrayBuffer(); }
  catch(e){ return { ok:false, message:'Não foi possível ler o PDF do termo para calcular o hash de integridade.' }; }
  const now = Date.now();
  const acc = { id: uid('acc'), termId: term.id, recipientName: term.responsibleName, recipientEmail: '', status:'pendente', tokenHash:null,
    delivery:o.mode, sentAt:null, lastSentAt:null, sendCount:0, expiresAt: now + (o.days || 7) * 86400000, docSha256: await sha256Hex(buf),
    acceptedAt:null, acceptedName:'', acceptedIp:'', acceptedUa:'', verificationCode:'', createdAt: now, createdBy: (ctx.operator || '').trim() };
  const ins = await client.from('term_acceptances').insert(toRow('acceptances', acc));
  if(ins.error) return { ok:false, message:'Não foi possível registrar a solicitação: ' + ins.error.message + ' — rode o supabase/schema.sql atualizado.' };
  const r = await callAcceptanceFn(ctx, { action:'send', acceptanceId: acc.id, mode:o.mode, appUrl: location.origin + location.pathname });
  if(!r.ok){ await callAcceptanceFn(ctx, { action:'cancel', acceptanceId: acc.id }); await ctx.sync.refresh(true); return r; }
  await ctx.sync.refresh(true);
  return { ok:true, delivery:r.delivery, link:r.link, email: acc.recipientEmail };
}

function SendAcceptanceModal({ ctx, term, initialRes, onClose }){
  const { db, notify } = ctx;
  const [days, setDays] = useState(7);
  const [busy, setBusy] = useState(false); const [res, setRes] = useState(initialRes || null); const [err, setErr] = useState(null);
  const accs = accsOf(db, term.id); const accepted = accs.find(a => a.status === 'aceito');
  const pending = accs.find(a => a.status === 'pendente' && effStatus(a) === 'pendente' && a.sentAt);
  const submit = async () => {
    setBusy(true); setErr(null);
    const r = await requestAcceptance(ctx, term, { days, mode:'manual' });
    setBusy(false);
    if(r.ok) setRes(r); else setErr(r);
  };
  const copy = async link => { try{ await navigator.clipboard.writeText(link); notify('Link copiado.', 'success'); }catch(e){ notify('Não foi possível copiar automaticamente.', 'error'); } };
  return (
    <Modal title={`Link de aceite digital — ${term.number}`} onClose={onClose} width={560} footer={
      res ? <button className="btn btn-primary" onClick={onClose}>Fechar</button> :
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" onClick={submit} disabled={busy || !!accepted}>{busy ? 'Gerando...' : 'Gerar link'}</button></React.Fragment>
    }>
      {accepted && <div style={{ fontSize:13, color:'#A8DDBF', marginBottom:10 }}>Este termo já foi aceito digitalmente em {fmtBR(accepted.acceptedAt)}. Não é possível gerar outro link.</div>}
      {res ? (
        <div style={{ fontSize:13, lineHeight:1.6 }}>
          <div style={{ color:'#A8DDBF', fontWeight:700, marginBottom:6 }}>Link gerado para {term.responsibleName}.</div>
