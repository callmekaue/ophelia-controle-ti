        {item && <div style={{ fontSize:12, color:'var(--text-faint)', marginBottom:12 }}>Criada por <b style={{ color:'var(--text-muted)' }}>{item.createdBy || '—'}</b> em {fmtDT(item.createdAt)}{item.level === 'concluido' ? ' · concluída em ' + fmtDT(item.completedAt || item.updatedAt) : ''}</div>}
        <div style={{ ...lbl, marginTop:0 }}>Título</div>
        <input value={f.title} onChange={e=>setF({ ...f, title:e.target.value })} placeholder="Ex.: Trocar switch do G2" autoFocus />
        <div style={lbl}>Detalhes (opcional)</div>
        <textarea rows={4} value={f.description} onChange={e=>setF({ ...f, description:e.target.value })} placeholder="O que precisa ser feito, onde, quem avisar..." />
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
          <div><div style={lbl}>Nível</div>
            <select value={f.level} onChange={e=>setF({ ...f, level:e.target.value })}>{PLAN_LEVELS.map(l => <option key={l.key} value={l.key}>{l.title}</option>)}</select></div>
          <div><div style={lbl}>Prazo (opcional)</div>
            <input type="date" value={f.dueDate || ''} onChange={e=>setF({ ...f, dueDate:e.target.value })} /></div>
        </div>
      </fieldset>
    </Modal>
  );
}
/* ============ Tarefas mensais ============ */
const curYM = ()=>{ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const ymLabel = (ym)=>{ const [y, m] = ym.split('-').map(Number); const t = new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); };
const ymShift = (ym, n)=>{ const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const parseChecks = (t)=>{ try{ return JSON.parse(t.checks || '{}') || {}; }catch(_){ return {}; } };
function MonthlyModal({ ctx, item, onClose }){
  const [f, setF] = useState({ title:'', description:'', ...(item || {}) });
  const lbl = { fontSize:12, fontWeight:600, color:'var(--text-muted)', marginBottom:6, marginTop:14 };
  const save = ()=>{ if(ctx.actions.saveMonthly({ ...f })) onClose(); };
  const del = ()=> ctx.askConfirm({ title:'Excluir tarefa mensal', tone:'danger', confirmLabel:'Excluir', message:`Excluir a tarefa "${f.title}" e todo o histórico de checks dela?`, onConfirm: ()=>{ ctx.actions.deleteMonthly(item.id); onClose(); } });
  return (
    <Modal title={item ? 'Tarefa mensal' : 'Nova tarefa mensal'} onClose={onClose} width={480}
      footer={<div style={{ display:'flex', gap:8, padding:'12px 18px', justifyContent:'space-between', alignItems:'center' }}>
        <div>{item && <button className="btn btn-danger btn-sm" onClick={del}>Excluir</button>}</div>
        <div style={{ display:'flex', gap:8 }}><button className="btn btn-ghost" onClick={onClose}>Cancelar</button><button className="btn btn-primary" onClick={save}>Salvar</button></div>
      </div>}>
      <div style={{ ...lbl, marginTop:0 }}>O que precisa ser feito todo mês</div>
      <input value={f.title} onChange={e=>setF({ ...f, title:e.target.value })} placeholder="Ex.: Perguntar aos galpões se precisam de computador novo" autoFocus />
      <div style={lbl}>Detalhes (opcional)</div>
      <textarea rows={3} value={f.description} onChange={e=>setF({ ...f, description:e.target.value })} placeholder="Como fazer, quem avisar..." />
    </Modal>
  );
}
function MonthlyTasks({ ctx, canEdit }){
  const [ym, setYm] = useState(curYM);
  const [editing, setEditing] = useState(undefined);
  const [title, setTitle] = useState('');
  useEffect(()=>{ const t = setInterval(()=> setYm(curYM()), 30000); return ()=> clearInterval(t); }, []);
  const tasks = [...(ctx.db.monthlyTasks || [])].sort((a, b) => (a.position || 0) - (b.position || 0));
  const doneN = tasks.filter(t => parseChecks(t)[ym]).length;
  const pct = tasks.length ? Math.round(doneN / tasks.length * 100) : 0;
  const months = [-5, -4, -3, -2, -1, 0].map(n => ymShift(ym, n));
  const add = ()=>{ const t = title.trim(); if(!t) return; if(ctx.actions.saveMonthly({ title:t })) setTitle(''); };
  const fmt = (ms)=> new Date(Number(ms)).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  return (
    <div className="card" style={{ padding:0, marginBottom:18, borderTop:'3px solid #C7CDD3' }}>
      <div style={{ padding:'16px 18px 12px', display:'flex', justifyContent:'space-between', alignItems:'flex-end', gap:12, flexWrap:'wrap' }}>
        <div>
          <div className="font-display" style={{ fontSize:22, fontWeight:700, color:'var(--accent-strong)', lineHeight:1.1 }}>Tarefas mensais · {ymLabel(ym)}</div>
          <div style={{ fontSize:12.5, color:'var(--text-faint)', marginTop:3 }}>Marque o que já foi feito neste mês. No dia 1º de cada mês os checks voltam do zero.</div>
        </div>
        <div style={{ minWidth:200, textAlign:'right' }}>
          <div style={{ fontSize:12.5, color: tasks.length && doneN === tasks.length ? 'var(--success)' : 'var(--text-muted)', fontWeight:700 }}>{tasks.length ? (doneN === tasks.length ? 'Tudo feito neste mês ✓' : doneN + ' de ' + tasks.length + ' feitas') : 'Nenhuma tarefa cadastrada'}</div>
          <div style={{ height:7, borderRadius:6, background:'#ffffff0d', overflow:'hidden', marginTop:6 }}><div style={{ width:pct + '%', height:'100%', background:'linear-gradient(90deg,#536C7B,#C7CDD3)', borderRadius:6, transition:'width .3s' }} /></div>
        </div>
      </div>
      <div style={{ padding:'0 12px 8px', display:'flex', flexDirection:'column', gap:6 }}>
        {tasks.map(t => {
          const ck = parseChecks(t); const done = ck[ym];
          return (
            <div key={t.id} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 10px', borderRadius:10, background: done ? '#A69BAD10' : '#ffffff06', border:'1px solid ' + (done ? '#A69BAD44' : '#23262E') }}>
              <button disabled={!canEdit} onClick={()=>ctx.actions.toggleMonthly(t.id, ym)} title={done ? 'Desmarcar' : 'Marcar como feito neste mês'}
                style={{ width:28, height:28, borderRadius:8, flexShrink:0, cursor: canEdit ? 'pointer' : 'default', border:'2px solid ' + (done ? '#C7CDD3' : '#3D424C'), background: done ? 'linear-gradient(135deg,#E6E3EA,#536C7B)' : 'transparent', color:'#101116', fontWeight:900, fontSize:16, lineHeight:1, padding:0 }}>{done ? '✓' : ''}</button>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontWeight:600, fontSize:14, textDecoration: done ? 'line-through' : 'none', opacity: done ? .65 : 1 }}>{t.title}</div>
                <div style={{ fontSize:12, color:'var(--text-faint)', marginTop:2 }}>{done ? 'Feito em ' + fmt(done.at) + (done.by ? ' por ' + done.by : '') : (t.description || 'Pendente neste mês')}</div>
              </div>
              <div title="Últimos 6 meses" style={{ display:'flex', gap:4, flexShrink:0 }}>
                {months.map(m => <span key={m} title={ymLabel(m) + (ck[m] ? ' — feito' : ' — não feito')} style={{ width:11, height:11, borderRadius:3, background: ck[m] ? '#C7CDD3' : '#ffffff14', outline: m === ym ? '1.5px solid #E6E3EA' : 'none', outlineOffset:1 }} />)}
              </div>
              {canEdit && <button className="btn btn-ghost btn-sm" title="Editar" onClick={()=>setEditing(t)} style={{ padding:'3px 8px' }}>Editar</button>}
            </div>
          );
        })}
        {!tasks.length && <div style={{ textAlign:'center', fontSize:13, color:'var(--text-faint)', padding:'16px 8px', border:'1px dashed var(--border)', borderRadius:10 }}>{canEdit ? 'Cadastre abaixo as tarefas que você precisa fazer todo mês.' : 'Nenhuma tarefa mensal cadastrada.'}</div>}
      </div>
      {canEdit && (
        <div style={{ padding:'4px 12px 14px', display:'flex', gap:8 }}>
          <input value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>{ if(e.key === 'Enter') add(); }} placeholder="+ Nova tarefa mensal (Enter para adicionar)" />
          <button className="btn btn-primary btn-sm" onClick={add}>Adicionar</button>
        </div>
      )}
      {editing !== undefined && <MonthlyModal ctx={ctx} item={editing} onClose={()=>setEditing(undefined)} />}
    </div>
  );
}

function PlanningScreen({ ctx }){
  const { actions } = ctx; const canEdit = ctx.can('planning', 'edit');
  const [dragId, setDragId] = useState(null);
  const [overCol, setOverCol] = useState(null);
  const [overCard, setOverCard] = useState(null);
  const [editing, setEditing] = useState(undefined);   // undefined = fechado, null = nova, objeto = editar
  const [newLevel, setNewLevel] = useState('nao_urgente');
  const [quick, setQuick] = useState({});
  const [q, setQ] = useState('');
  const [mobCol, setMobCol] = useState(PLAN_LEVELS[0].key);   // no celular mostra uma coluna por vez
  const all = ctx.db.demands || [];
  const term = q.trim().toLowerCase();
  const shown = all.filter(d => !term || ((d.title || '') + ' ' + (d.description || '')).toLowerCase().includes(term));
  const levelOf = d => PLAN_LEVELS.some(l => l.key === d.level) ? d.level : 'nao_urgente';
  const col = key => shown.filter(d => levelOf(d) === key).sort((a, b) => (a.position || 0) - (b.position || 0));
  const today = new Date().toISOString().slice(0, 10);
  const endDrag = ()=>{ setDragId(null); setOverCol(null); setOverCard(null); };
  const drop = (key, beforeId)=>{ if(dragId) actions.moveDemand(dragId, key, beforeId || null); endDrag(); };
  const addQuick = (key)=>{ const t = (quick[key] || '').trim(); if(!t) return; if(actions.saveDemand({ title:t, level:key })) setQuick({ ...quick, [key]:'' }); };
  const open = all.filter(d => levelOf(d) !== 'concluido').length;
  return (
    <div className="fade-up">
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-end', gap:12, flexWrap:'wrap', marginBottom:16 }}>
        <div>
          <h1 style={{ margin:0, fontSize:28 }}>Planejamento em T.I.</h1>
          <div style={{ color:'var(--text-muted)', fontSize:13.5, marginTop:4 }}>{open} demanda(s) em aberto · {canEdit ? <React.Fragment><span className="hide-mobile">arraste os cards entre as colunas para mudar a urgência</span><span className="only-mobile">toque num card para editar ou mudar a urgência</span></React.Fragment> : 'somente visualização'}</div>
        </div>
        <div className="head-actions" style={{ display:'flex', gap:8, alignItems:'center' }}>
          <input type="search" value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar demanda..." style={{ width:220 }} />
          {canEdit && <button className="btn btn-primary" onClick={()=>{ setNewLevel('nao_urgente'); setEditing(null); }}><Icon path={ICONS.plus} size={14}/> Nova demanda</button>}
        </div>
      </div>
      <MonthlyTasks ctx={ctx} canEdit={canEdit} />
      <div className="seg plan-switch only-mobile" role="tablist">
        {PLAN_LEVELS.map(l => <button key={l.key} role="tab" aria-selected={mobCol === l.key} className={mobCol === l.key ? 'on' : ''} onClick={()=>setMobCol(l.key)} style={{ '--c':l.color }}><span className="dot" style={{ background:l.color }} />{l.title}<span className="ct">{col(l.key).length}</span></button>)}
      </div>
      <div className="plan-board" style={{ display:'grid', gridTemplateColumns:'repeat(4, minmax(250px, 1fr))', gap:14, overflowX:'auto', paddingBottom:10, alignItems:'start' }}>
        {PLAN_LEVELS.map(l => {
          const items = col(l.key);
          return (
            <div key={l.key} className={`card plan-col ${mobCol === l.key ? 'mob-on' : ''}`}
              onDragOver={e=>{ if(!dragId) return; e.preventDefault(); setOverCol(l.key); setOverCard(null); }}
              onDrop={e=>{ e.preventDefault(); drop(l.key, null); }}
              style={{ padding:0, borderTop:'3px solid ' + l.color, outline: overCol === l.key && dragId ? '2px dashed ' + l.color : 'none', outlineOffset:-2, minHeight:260 }}>
              <div style={{ padding:'14px 14px 10px', display:'flex', alignItems:'center', justifyContent:'space-between' }}>
                <div>
                  <div className="font-display" style={{ fontSize:20, fontWeight:700, color:l.color, lineHeight:1.1 }}>{l.title}</div>
                  <div style={{ fontSize:11.5, color:'var(--text-faint)', marginTop:2 }}>{l.hint}</div>
                </div>
                <span style={{ fontSize:12, fontWeight:700, padding:'2px 9px', borderRadius:20, background:'#ffffff10', color:'var(--text-muted)' }}>{items.length}</span>
              </div>
              <div style={{ padding:'0 10px 10px', display:'flex', flexDirection:'column', gap:8 }}>
                {items.map(d => {
                  const late = d.dueDate && d.dueDate < today && l.key !== 'concluido';
                  return (
                    <div key={d.id} className="plan-card" draggable={canEdit}
                      onDragStart={e=>{ setDragId(d.id); e.dataTransfer.effectAllowed = 'move'; try{ e.dataTransfer.setData('text/plain', d.id); }catch(_){} }}
                      onDragEnd={endDrag}
                      onDragOver={e=>{ if(!dragId) return; e.preventDefault(); e.stopPropagation(); setOverCol(l.key); setOverCard(d.id); }}
                      onDrop={e=>{ e.preventDefault(); e.stopPropagation(); drop(l.key, d.id); }}
                      onClick={()=>setEditing(d)}
                      style={{ opacity: dragId === d.id ? .35 : 1, boxShadow: overCard === d.id && dragId !== d.id ? '0 -3px 0 0 ' + l.color : 'none', cursor: canEdit ? 'grab' : 'pointer' }}>
                      <div style={{ fontWeight:600, fontSize:14, lineHeight:1.35, textDecoration: l.key === 'concluido' ? 'line-through' : 'none', opacity: l.key === 'concluido' ? .7 : 1 }}>{d.title}</div>
                      {d.description && <div style={{ fontSize:12.5, color:'var(--text-muted)', marginTop:5, lineHeight:1.45, display:'-webkit-box', WebkitLineClamp:3, WebkitBoxOrient:'vertical', overflow:'hidden', whiteSpace:'pre-wrap' }}>{d.description}</div>}
                      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginTop:9, gap:8, minHeight:22 }}>
                        {d.dueDate ? <span style={{ fontSize:11.5, fontWeight:600, padding:'2px 8px', borderRadius:6, background: late ? 'var(--danger-soft)' : '#ffffff0d', color: late ? 'var(--danger)' : 'var(--text-muted)' }}>{late ? 'Atrasada · ' : 'Prazo · '}{d.dueDate.split('-').reverse().join('/')}</span> : <span />}
                        {canEdit && l.key !== 'concluido' && <button className="btn btn-ghost btn-sm" title="Marcar como concluída" onClick={e=>{ e.stopPropagation(); actions.moveDemand(d.id, 'concluido', null); }} style={{ padding:'2px 8px' }}>✓ Concluir</button>}
                      </div>
                    </div>
                  );
                })}
                {!items.length && <div style={{ textAlign:'center', fontSize:12.5, color:'var(--text-faint)', padding:'22px 8px', border:'1px dashed var(--border)', borderRadius:10 }}>{term ? 'Nenhuma demanda encontrada.' : (canEdit ? 'Arraste um card para cá' : 'Sem demandas')}</div>}
                {canEdit && (
                  <div style={{ display:'flex', gap:6, marginTop:2 }}>
                    <input value={quick[l.key] || ''} onChange={e=>setQuick({ ...quick, [l.key]:e.target.value })} onKeyDown={e=>{ if(e.key === 'Enter') addQuick(l.key); }} placeholder="+ Nova demanda (Enter)" style={{ fontSize:13 }} />
                    <button className="btn btn-ghost btn-sm" title="Adicionar com detalhes" onClick={()=>{ setNewLevel(l.key); setEditing(null); }}>···</button>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
      {(() => {
        const done = shown.filter(d => levelOf(d) === 'concluido').map(d => ({ ...d, _end: Number(d.completedAt || d.updatedAt || 0) })).sort((a, b) => b._end - a._end);
        const span = d => { if(!d._end || !d.createdAt) return '—'; const days = Math.round((d._end - Number(d.createdAt)) / 86400000); return days <= 0 ? 'No mesmo dia' : days + ' dia(s)'; };
        return (
          <div className="card" style={{ marginTop:18, padding:0, overflowX:'auto' }}>
            <div style={{ padding:'16px 18px 8px', display:'flex', alignItems:'baseline', gap:10 }}>
              <h3 style={{ margin:0, fontSize:20, fontWeight:700 }}>Histórico de demandas concluídas</h3>
              <span style={{ fontSize:12.5, color:'var(--text-faint)' }}>{done.length} concluída(s)</span>
            </div>
            {done.length ? (
              <table style={{ width:'100%' }}>
                <thead><tr><th style={{ textAlign:'left' }}>Demanda</th><th style={{ textAlign:'left' }}>Criada por</th><th style={{ textAlign:'left' }}>Criada em</th><th style={{ textAlign:'left' }}>Concluída em</th><th style={{ textAlign:'left' }}>Tempo até concluir</th></tr></thead>
                <tbody>{done.map(d => (
                  <tr key={d.id} onClick={()=>setEditing(d)} style={{ cursor:'pointer' }}>
                    <td style={{ fontWeight:600 }}>{d.title}</td>
                    <td>{d.createdBy || '—'}</td>
                    <td>{fmtDT(d.createdAt)}</td>
                    <td>{fmtDT(d._end)}</td>
                    <td style={{ color:'var(--text-muted)' }}>{span(d)}</td>
                  </tr>))}
                </tbody>
              </table>
            ) : <div style={{ padding:'8px 18px 22px', fontSize:13, color:'var(--text-faint)' }}>{term ? 'Nenhuma demanda concluída encontrada.' : 'Quando você concluir uma demanda, ela aparece aqui com quem criou e as datas.'}</div>}
          </div>
        );
      })()}
      {editing !== undefined && <DemandModal ctx={ctx} item={editing} defaultLevel={newLevel} onClose={()=>setEditing(undefined)} />}
    </div>
  );
}

function InfraHome({ ctx }){

              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>

        </div>
      )}
      {adding && <AddSiteModal ctx={ctx} onClose={()=>setAdding(false)} />}
    </div>
  );
}

function SiteScreen({ ctx, id, initialTab }){
  const { db, navigate, askConfirm, actions } = ctx;
  const site = db.sites.find(s => s.id === id);
  const [tab, setTab] = useState(initialTab || 'cadastro');
  if(!site) return <div><button className="btn btn-ghost btn-sm" onClick={()=>navigate('infra')}><Icon path={ICONS.arrowLeft} size={14}/> Galpões</button><EmptyState text="Galpão não encontrado." /></div>;
  const nLinks = db.internetLinks.filter(x => x.siteId === id).length, nWifi = db.wifiNetworks.filter(x => x.siteId === id).length, nDev = db.netDevices.filter(x => x.siteId === id).length;
  const tabs = [['cadastro','Dados cadastrais'], ['endereco','Endereço e localização'], ['internet',`Internet e operadora (${nLinks})`], ['wifi',`Redes Wi-Fi (${nWifi})`], ['dispositivos',`Repetidores e pontos de acesso (${nDev})`], ['obs','Observações e informações adicionais']];
  const del = ()=> askConfirm({ title:'Excluir galpão', tone:'danger', confirmLabel:'Excluir galpão',
    message:`Excluir o galpão ${site.name}? Serão apagadas também ${nLinks} conexão(ões) de internet, ${nWifi} rede(s) Wi-Fi e ${nDev} dispositivo(s) de rede dele. Não pode ser desfeito.`,
    onConfirm: ()=>{ actions.deleteInfra('sites', id); navigate('infra'); } });
  return (
    <div className="fade-up">
      <button className="btn btn-ghost btn-sm" onClick={()=>navigate('infra')} style={{ marginBottom:14 }}><Icon path={ICONS.arrowLeft} size={14}/> Galpões</button>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:10, marginBottom:12 }}>
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}><h1 style={{ fontSize:26, margin:0, fontWeight:600 }}>{site.name}</h1><StatusBadge tone="indigo">{labelOf(SITE_TYPES, site.siteType)}</StatusBadge><StatusBadge tone={statusTone(site.status)}>{labelOf(SITE_STATUS, site.status)}</StatusBadge></div>
          <div style={{ fontSize:12, color:'var(--text-faint)', marginTop:4 }}>Última alteração: {updInfo(site)}</div>
        </div>
        {ctx.can('infra','edit') && <button className="btn btn-danger btn-sm" onClick={del}><Icon path={ICONS.trash} size={14}/> Excluir galpão</button>}
      </div>
      <OperatorBar ctx={ctx} />
      <div className="tabbar" role="tablist" style={{ display:'flex', gap:22, borderBottom:'1px solid var(--border)', marginBottom:20, overflowX:'auto' }}>
        {tabs.map(([k,l]) => <button key={k} onClick={()=>setTab(k)} className={`tab-btn ${tab === k ? 'active' : ''}`} style={{ background:'none', whiteSpace:'nowrap' }}>{l}</button>)}
      </div>
      {tab === 'cadastro' && <SiteSectionForm key={'c'+site.id} ctx={ctx} site={site} fields={SITE_SECTIONS.cadastro} />}
      {tab === 'endereco' && <SiteSectionForm key={'e'+site.id} ctx={ctx} site={site} fields={SITE_SECTIONS.endereco} />}
      {tab === 'obs' && <SiteSectionForm key={'o'+site.id} ctx={ctx} site={site} fields={SITE_SECTIONS.obs} />}
      {tab === 'internet' && <InfraList key={'i'+site.id} ctx={ctx} kind="internetLinks" site={site} />}
      {tab === 'wifi' && <InfraList key={'w'+site.id} ctx={ctx} kind="wifiNetworks" site={site} />}
      {tab === 'dispositivos' && <InfraList key={'d'+site.id} ctx={ctx} kind="netDevices" site={site} />}
    </div>
  );
}

(function boot(){
  const qs = new URLSearchParams(location.search);
  const root = ReactDOM.createRoot(document.getElementById('root'));
  if(qs.get('aceite')) root.render(<AcceptancePage token={qs.get('aceite')} project={qs.get('p') || ''} />);   // link de aceite: sem painel, sem login
  else root.render(<Root />);
})();

</script>
</body>
</html>
